<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Vault</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d0d0d;color:#f3ede0;padding:0 1.5rem 2rem}
.wrap{max-width:1100px;margin:0 auto}
.top{position:sticky;top:0;background:#0d0d0d;padding:.9rem 0;border-bottom:1px solid #473c1c;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:8}
h1{font-size:17px;font-weight:600;white-space:nowrap;background:linear-gradient(90deg,#e8c66a,#d4af37,#9a7d28);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
input{flex:1;min-width:160px;padding:8px 12px;border:1px solid #473c1c;border-radius:8px;background:#141414;color:#f3ede0;font-size:14px;outline:none}
input:focus{border-color:#d4af37}
.chips{display:flex;gap:8px;margin-top:.9rem;flex-wrap:wrap}
.chip{font-size:12.5px;color:#cfc7b5;border:1px solid #2c2820;border-radius:999px;padding:5px 13px;cursor:pointer;background:#141414}
.chip.on{color:#e8c66a;border-color:#d4af37;background:rgba(212,175,55,.14)}
.cnt{color:#6b6655;font-size:12px;margin-top:.8rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:.6rem;align-items:start}
.card{border:1px solid #473c1c;border-radius:12px;background:linear-gradient(150deg,#1a1812,#141414);cursor:pointer;height:104px;display:flex;gap:11px;padding:14px 16px;transition:.18s}
.card:hover{border-color:#d4af37;transform:translateY(-2px)}
.em{font-size:26px;flex-shrink:0}
.bd{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;height:100%}
.bg{font-size:10.5px;font-weight:600;color:#e8c66a;background:rgba(212,175,55,.14);border:1px solid #473c1c;border-radius:8px;padding:2px 9px;display:inline-block;margin-bottom:6px}
.tt{font-size:13px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ds{font-size:11px;color:#7a7568;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:3rem;color:#6b6655}
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9;align-items:center;justify-content:center}
.mbg.o{display:flex}
.md{background:linear-gradient(160deg,#1a1812,#121212);border:1px solid #9a7d28;border-radius:14px;padding:1.5rem;width:min(680px,94vw);max-height:88vh;overflow:auto}
.mh{display:flex;gap:10px;align-items:center;margin-bottom:1rem;flex-wrap:wrap}
.mt{font-size:15px;font-weight:600;color:#e8c66a;flex:1;min-width:120px}
.seclabel{font-size:11px;font-weight:600;color:#9a8f6e;text-transform:uppercase;letter-spacing:.04em;margin:1rem 0 .5rem}
pre{background:#0a0a0a;border:1px solid #473c1c;border-radius:8px;padding:12px;font-size:12px;color:#e6dcc4;font-family:monospace;white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto}
.cp{margin-top:1rem;padding:7px 16px;border:1px solid #d4af37;border-radius:8px;background:linear-gradient(135deg,#d4af37,#b8941f);color:#1a1500;font-weight:600;cursor:pointer}
.tbl{overflow-x:auto;border:1px solid #473c1c;border-radius:8px}
table{border-collapse:collapse;font-size:12px;min-width:100%}
th,td{border:1px solid #2c2820;padding:5px 9px;text-align:left;white-space:nowrap;color:#e6dcc4}
th{background:#1a1812;color:#e8c66a;position:sticky;top:0}
tbody tr:nth-child(even){background:#141210}
.muted{color:#6b6655;font-size:11px;margin-top:6px}
.link{display:inline-block;color:#e8c66a;font-size:13px;text-decoration:none;border:1px solid #473c1c;border-radius:8px;padding:6px 12px}
.link:hover{border-color:#d4af37}
.outnote{color:#6b6655;font-size:11px}
</style></head><body><div class="wrap">
<div class="top"><h1>&#10022; Code Vault</h1><input id="q" placeholder="&#128269; ค้นหา..." oninput="rd()"></div>
<div class="chips" id="chips"></div><div class="cnt" id="cnt"></div>
<div class="cards" id="c"></div></div>
<div class="mbg" id="mb"><div class="md">
<div class="mh"><span id="me" style="font-size:28px"></span><span class="bg" id="mbd"></span><span class="mt" id="mtt"></span></div>
<div class="ds" id="mds" style="margin-bottom:0;color:#9a9382;white-space:normal"></div>
<div class="seclabel">Code</div>
<pre id="mc"></pre>
<button class="cp" id="cb" onclick="cp()">คัดลอก</button>
<div id="outwrap" style="display:none"><div class="seclabel">ตัวอย่าง Output</div><div id="outbox"></div></div>
</div></div>
<script>
var D=[{"id": "1787797627799", "name": "TD Product Dimension", "type": "BigQuery", "desc": "td product assortment confidential", "code": "SELECT  \n  *\nFROM `tdshop-prod.dimension.product` \nWHERE created_d = current_date()-1\n  and product_type = 'INVENTORY'"}, {"id": "1787309637773", "name": "CJX Store by DC", "type": "BigQuery", "desc": "CJX Store by DC", "code": "SELECT distinct\n  store_code\n  ,case when policy_warehouse_code=\"WH001\" then \"DC1\" else \"DC2\" end as DC\nFROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_store` WHERE dt = \"2026-08-20\" LIMIT 1000"}, {"id": "1787213167120", "name": "TD First Clear Date", "type": "BigQuery", "desc": "TD First Clear Date. whether change to clear promotion before clear, it will appear", "code": "WITH\n  base AS (\n    -- dedup barcode-level grain → 1 row per article × date × status\n    SELECT DISTINCT\n      article_no,\n      created_d,\n      lower(product_status) AS status\n    FROM `tdshop-prod.dimension.product`\n    WHERE created_d <= current_date() - 1\n  ),\n  hist AS (\n    SELECT\n      article_no,\n      created_d,\n      status,\n      CASE\n        -- outside the clearing set → break\n        WHEN status NOT IN ('clear', 'clear_promotion', 'delete') THEN 1\n        -- entering the clearing set from outside (or first row) → new run\n        WHEN\n          ifnull(\n            lag(status) OVER (PARTITION BY article_no ORDER BY created_d),\n            'X')\n          NOT IN ('clear', 'clear_promotion', 'delete')\n          THEN 1\n        ELSE 0\n        END AS break_flag\n    FROM base\n    QUALIFY\n      -- keep only articles whose CURRENT status is in the clearing set\n      last_value(status)\n        OVER (\n          PARTITION BY article_no\n          ORDER BY created_d\n          ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING\n        )\n      IN ('clear', 'clear_promotion', 'delete')\n  ),\n  grp AS (\n    SELECT\n      article_no,\n      created_d,\n      status,\n      sum(break_flag)\n        OVER (\n          PARTITION BY article_no\n          ORDER BY created_d\n          ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n        ) AS grp_id\n    FROM hist\n  ),\n  last_grp AS (\n    SELECT article_no, max(grp_id) AS last_grp_id\n    FROM grp\n    WHERE status IN ('clear', 'clear_promotion', 'delete')\n    GROUP BY 1\n  )\nSELECT\n  g.article_no,\n  CASE\n    WHEN countif(g.status = 'clear') > 0 THEN 'clear'\n    WHEN countif(g.status = 'clear_promotion') > 0 THEN 'clear_promotion'\n    ELSE 'delete'\n    END AS status,\n  min(g.created_d) AS status_start_date\nFROM grp g\nJOIN last_grp l\n  ON g.article_no = l.article_no AND g.grp_id = l.last_grp_id\nWHERE\n  g.article_no IN ('12103757','12103828','12103969')  -- paste your 534 list\nGROUP BY g.article_no\nORDER BY g.article_no"}, {"id": "1785491006422", "name": "CJX Display Unit", "type": "BigQuery", "desc": "return barcode on shelf (display unit)", "code": "SELECT distinct article_no, barcode,unit, unit_factor\nFROM `cjx-data-core.cjx_dwh_assortment_prod.dim_shelf_inventory_v1` \nwhere shelf_status = 'ACTIVE'"}, {"id": "1784891606821", "name": "CJX SCM OOS Day", "type": "BigQuery", "desc": "CJX SCM OOS Day", "code": "select  *  from `tdshop-data-business-units.scm_sandbox.cjx_rpm_okr_oos_dashboard_details_business_control`\nlimit 10"}, {"id": "1784631873479", "name": "CJX Stock by Article", "type": "BigQuery", "desc": "cjx stock by article. it is stock end of day at midnight", "code": "SELECT \n  movement_d\n  ,store_code\n  ,article_no\n  ,product_name\n  ,sum(available_qty) as available_qty\nFROM `cjx-data-core.cjx_data_mart_prod.mart_console_store_stock`\nWHERE movement_d between '2026-07-17' and current_date()-1\n  and available_qty > 0\n  and store_code like 'CJX0%'\n  and article_no = '20006978'\ngroup by 1,2,3,4"}, {"id": "1784631835553", "name": "CJX Stock Movement", "type": "BigQuery", "desc": "CJX Stock Movement", "code": "SELECT article_no, store_code, movement_d, SUM(quantity)\nFROM `cjx-data-core.cjx_data_mart_prod.mart_console_stock_movement` \nWHERE movement_d between '2026-07-18' and current_date()-1\n  and store_code like 'CJX0%'\n  and article_no = '20006978'\n  and movement_type = 'RECEIVED_RO'\ngroup by 1,2,3"}, {"id": "1784624252013", "name": "TD Hold Unhold Reason", "type": "BigQuery", "desc": "TD Hold Unhold Reason", "code": "select\n  *\nfrom `tdshop-prod.publish_order.td_nest_z8_hold_request`\nwhere dt = current_date()-1\n  and status = 'APPROVED'\n  --and store_code = 'TH002979'\n  --and article_no = '20013944'\nqualify row_number() over (partition by article_no order by requested_date desc) = 1"}, {"id": "1784536151049", "name": "CJX Shelf Master History", "type": "BigQuery", "desc": "CJX Shelf Master History", "code": "SELECT * FROM `cjx-data-core.cjx_dwh_assortment_prod.dim_shelf_inventory_history_v1` \nWHERE as_of_date = \"2026-07-19\"\n  and shelf_code = '0012-00471'\nLIMIT 1000"}, {"id": "1784536042390", "name": "CJX Shelf Master", "type": "BigQuery", "desc": "cjx shelf by article master", "code": "SELECT * \nFROM `cjx-data-core.cjx_dwh_assortment_prod.dim_shelf_inventory_v1` \nwhere shelf_status = 'ACTIVE'\nLIMIT 10"}, {"id": "1784262223000", "name": "CJX DTS OD and RO Tracking", "type": "BigQuery", "desc": "return od no and ro no with order amt and receive amt", "code": "with od_no as(\n  SELECT\n    order_no\n    ,order_status\n    ,gr_no as ro_no\n    ,sum(order_amount) as order_amount\n  FROM `cjx-data-core.cjx_dwh_order_prod.fact_order_v1` \n  WHERE order_d between '2026-06-01' and current_date()-1\n    and delivery_method = 'SUPPLIER'\n  group by 1,2,3\n),\nor_no as (\n  select\n    gr_no as ro_no\n    ,date(gr_date) as ro_date\n    ,sum(receive_qty) as receive_qty\n    ,sum(receive_amount) as receive_amount\n    ,sum(unit_factor*receive_amount) as total_receive_amount\n    ,sum(claim_qty) as claim_qty\n    ,sum(claim_amount) as claim_amount\n    ,sum(remain_qty) as remain_qty \n    ,sum(remain_amount) as remain_amount\n  from `cjx-data-core.cjx_data_mart_prod.mart_console_receive_order` as r\n  where r.gr_d between '2026-06-01' and current_date()-1\n    and gr_type != 'WAREHOUSE'\n    and article_no like '2%'\n  group by 1,2\n)\nselect\n  od_no.*\n  ,or_no.*\nfrom od_no\nleft join or_no on or_no.ro_no = od_no.ro_no"}, {"id": "1784177923838", "name": "CJ Cost", "type": "BigQuery", "desc": "cj cost for td cost diff", "code": "select *\nfrom `tdshop-prod.publish_assortment.cj_z9_all_price_views`\nwhere article_no like '2%'"}, {"id": "1784177872238", "name": "TD Cost", "type": "BigQuery", "desc": "td cost for td cost diff", "code": "SELECT * \nFROM `tdshop-prod.publish_assortment.td_nest_product_supplier_price_by_dc` \nwhere dt = current_date()-1\n  and order_from_name like '%ซี.เจ%'\n  and expire_date > current_timestamp()\norder by barcode asc, unit_price desc"}, {"id": "1782981195287", "name": "CJX Category Performance DB_OOS Page", "type": "BigQuery", "desc": "TOP 10 OOS ARTICLES PER SUB_CLASS", "code": "-- ============================================================\n-- TOP 10 ARTICLES PER SUB_CLASS — OOS opportunity baht loss\n-- lost_baht = oos_streak_days × ROS(qty/day) × RSP(inc-VAT), per store×article, summed to article\n-- ============================================================\nDECLARE anchor         DATE;\nDECLARE prod_dt        DATE;\nDECLARE ros_asof       DATE;\nDECLARE lookback_start DATE;\n\nSET anchor = (\n  SELECT MAX(movement_d)\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_store_stock`\n  WHERE movement_d <= DATE_SUB(CURRENT_DATE('Asia/Bangkok'), INTERVAL 1 DAY)\n);\nSET prod_dt = (\n  SELECT MAX(dt)\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n  WHERE dt <= anchor\n);\nSET ros_asof = (\n  SELECT MAX(as_of_date)\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_ros_average_sales`\n  WHERE as_of_date <= anchor\n);\nSET lookback_start = DATE_SUB(anchor, INTERVAL 180 DAY);\n\nWITH product_dim AS (\n  SELECT DISTINCT article_no, family, class, sub_class, product_name, product_status\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n  WHERE dt = prod_dt\n    AND product_status IN ('ACTIVE','NEW')\n),\nstock AS (\n  SELECT store_code, article_no, movement_d, available_qty\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_store_stock`\n  WHERE movement_d BETWEEN lookback_start AND anchor\n    AND store_code LIKE 'CJX0%'\n),\noos_now AS (\n  SELECT store_code, article_no\n  FROM stock WHERE movement_d = anchor AND available_qty = 0\n),\nlast_in_stock AS (\n  SELECT store_code, article_no,\n         MAX(IF(available_qty > 0, movement_d, NULL)) AS last_stock_day\n  FROM stock GROUP BY store_code, article_no\n),\nstreak AS (\n  SELECT s.store_code, s.article_no,\n    COUNTIF(\n      s.available_qty = 0\n      AND s.movement_d > COALESCE(l.last_stock_day, DATE_SUB(lookback_start, INTERVAL 1 DAY))\n    ) AS oos_days\n  FROM stock s\n  JOIN oos_now n USING (store_code, article_no)\n  LEFT JOIN last_in_stock l USING (store_code, article_no)\n  GROUP BY s.store_code, s.article_no\n),\n-- NEW: 30-day ROS (qty/day) per store×article\nros AS (\n  SELECT store_code, article_no,\n         AVG(cjx_ros_qty_data_point_ex_event_period) AS ros\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_ros_average_sales`\n  WHERE as_of_date = ros_asof\n  GROUP BY 1, 2\n),\n-- NEW: latest RSP (inc-VAT) per article from sales\nrsp AS (\n  SELECT article_no, rsp_per_unit_inc_vat\n  FROM (\n    SELECT article_no, rsp_per_unit_inc_vat,\n      ROW_NUMBER() OVER (PARTITION BY article_no ORDER BY receipt_date DESC) AS rn\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_sales`\n    WHERE receipt_date BETWEEN lookback_start AND anchor\n      AND document_type != 'REFUND'\n      AND store_code LIKE 'CJX0%'\n      AND rsp_per_unit_inc_vat > 0\n  )\n  WHERE rn = 1\n),\n-- NEW: per store×article loss\nloss AS (\n  SELECT\n    st.store_code, st.article_no, st.oos_days,\n    r.ros,\n    st.oos_days * COALESCE(r.ros, 0)                             AS lost_qty,\n    st.oos_days * COALESCE(r.ros, 0) * COALESCE(p.rsp_per_unit_inc_vat, 0) AS lost_baht\n  FROM streak st\n  LEFT JOIN ros r USING (store_code, article_no)\n  LEFT JOIN rsp p USING (article_no)\n),\narticle_agg AS (\n  SELECT\n    pd.family, pd.class, pd.sub_class, l.article_no,\n    pd.product_name, pd.product_status,\n    COUNT(DISTINCT l.store_code)   AS oos_store_count,\n    ROUND(AVG(l.oos_days), 1)      AS avg_oos_days,\n    ROUND(SUM(l.lost_qty), 1)      AS lost_qty,          -- NEW\n    ROUND(SUM(l.lost_baht), 2)     AS lost_baht          -- NEW\n  FROM loss l\n  JOIN product_dim pd USING (article_no)\n  GROUP BY pd.family, pd.class, pd.sub_class, l.article_no,\n           pd.product_name, pd.product_status\n),\nranked AS (\n  SELECT *,\n    ROW_NUMBER() OVER (\n      PARTITION BY sub_class\n      ORDER BY lost_baht DESC, oos_store_count DESC, article_no   -- CHANGED: rank by baht loss\n    ) AS rn\n  FROM article_agg\n)\nSELECT family, class, sub_class, article_no, product_name, product_status,\n       oos_store_count, avg_oos_days, lost_qty, lost_baht, rn AS rank_in_subclass\nFROM ranked\nWHERE rn <= 10\nORDER BY sub_class, rn;"}, {"id": "1782978986950", "name": "CJX Category Performance DB_OOS Days by Store by Article", "type": "BigQuery", "desc": "OOS Days by Store by Article", "code": "-- ============================================================\n-- AXIS 1: BY STORE × ARTICLE — current OOS streak (ACTIVE/NEW only)\n-- ============================================================\nDECLARE anchor         DATE;\nDECLARE prod_dt        DATE;\nDECLARE lookback_start DATE;\n\nSET anchor = (\n  SELECT MAX(movement_d)\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_store_stock`\n  WHERE movement_d <= DATE_SUB(CURRENT_DATE('Asia/Bangkok'), INTERVAL 1 DAY)\n);\nSET prod_dt = (\n  SELECT MAX(dt)\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n  WHERE dt <= anchor\n);\nSET lookback_start = DATE_SUB(anchor, INTERVAL 180 DAY);\n\nWITH product_dim AS (\n  SELECT DISTINCT article_no, family, class, sub_class, product_name, product_status\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n  WHERE dt = prod_dt\n    AND product_status IN ('ACTIVE','NEW')\n),\nstock AS (\n  SELECT store_code, article_no, movement_d, available_qty\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_store_stock`\n  WHERE movement_d BETWEEN lookback_start AND anchor\n    AND store_code LIKE 'CJX0%'\n),\noos_now AS (\n  SELECT store_code, article_no\n  FROM stock WHERE movement_d = anchor AND available_qty = 0\n),\nlast_in_stock AS (\n  SELECT store_code, article_no,\n         MAX(IF(available_qty > 0, movement_d, NULL)) AS last_stock_day\n  FROM stock GROUP BY store_code, article_no\n),\nstreak AS (\n  SELECT s.store_code, s.article_no,\n    COUNTIF(\n      s.available_qty = 0\n      AND s.movement_d > COALESCE(l.last_stock_day, DATE_SUB(lookback_start, INTERVAL 1 DAY))\n    ) AS oos_days\n  FROM stock s\n  JOIN oos_now n USING (store_code, article_no)\n  LEFT JOIN last_in_stock l USING (store_code, article_no)\n  GROUP BY s.store_code, s.article_no\n),\njoined AS (                        -- INNER JOIN drops non-ACTIVE/NEW articles\n  SELECT pd.family, pd.class, pd.sub_class, st.store_code, st.article_no,\n         pd.product_name, pd.product_status, st.oos_days\n  FROM streak st\n  JOIN product_dim pd USING (article_no)\n),\nranked AS (\n  SELECT *,\n    ROW_NUMBER() OVER (PARTITION BY sub_class, store_code ORDER BY oos_days DESC, article_no) AS rn\n  FROM joined\n)\nSELECT family, class, sub_class, store_code, article_no, product_name, product_status,\n       oos_days, rn AS rank_in_store\nFROM ranked\nWHERE rn <= 10\nORDER BY sub_class, store_code, rn;"}, {"id": "1782978701496", "name": "CJX Clear and Clear Promotion with Stock No Assortment", "type": "BigQuery", "desc": "return article with clear and clear promotion status and stock more than 0 and have no store assortment", "code": "WITH\n  dim AS (\n    SELECT DISTINCT\n      article_no,\n      product_name,\n      lower(product_status) AS product_status\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n    WHERE dt = current_date() - 1\n      AND lower(product_status) IN ('clear', 'clear_promotion')\n      AND unit_factor = 1\n      and article_no like '2%'\n  ),\n  stock AS (\n    SELECT\n      article_no,\n      sum(available_qty) AS available_qty\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_store_stock`\n    WHERE movement_d = current_date() - 1\n      AND available_qty > 0\n      AND store_code LIKE 'CJX0%'\n    GROUP BY 1\n  ),\n  assortment AS (\n    SELECT DISTINCT article_no\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_store_assortment_store`\n    WHERE as_of_date = current_date() - 1\n  )\nSELECT\n  d.article_no,\n  d.product_name,\n  d.product_status,\n  s.available_qty\nFROM dim d\nJOIN stock s ON s.article_no = d.article_no\nLEFT JOIN assortment a ON a.article_no = d.article_no\nWHERE a.article_no IS NULL   -- keep only articles NOT in assortment\nORDER BY d.article_no"}, {"id": "1782976133516", "name": "CJX Category Performance DB_RTC Destroy Page", "type": "BigQuery", "desc": "return file for claude to build cjx category performance top 20 RTC and Destroy", "code": "-- ============================================================\n-- DAILY PER-ARTICLE RAW DATA — RTC / Destroy / Sales\n-- One row per (txn_date × article_no). NO ranking, NO period aggregation.\n-- Dashboard filters by date client-side, then aggregates → ranks top 20.\n--\n-- ⚠️ VAT BASIS (remark for dashboard):\n--   - sales_inc      = INC-VAT sales\n--   - sales_exc      = EX-VAT sales\n--   - rtc_value      = INC-VAT  (sale_type='REDUCE_TO_CLEAR')   ← rank/headline RTC on this\n--   - destroy_value  = EX-VAT cost (moving cost ex-VAT × qty; no inc-VAT version)\n--   Dashboard maths:\n--     RTC %to-own-sales     = SUM(rtc_value)     ÷ SUM(sales_inc)  per article\n--     Destroy %to-own-sales = SUM(destroy_value) ÷ SUM(sales_exc)  per article\n--     %to-total             = article SUM ÷ grand-total SUM of that metric (within filtered window)\n--\n-- Period filter (done in dashboard, this year only):\n--   MTD      = month-start → today      | YTD = Jan 1 → today | flexible = any pair\n--\n-- Locked rules (consistent with dashboard_combined.sql):\n--   - Store exclusion: Grand Opening only (day_type = 'สาขาเปิดใหม่')\n--   - store_code LIKE 'CJX0%' ; document_type != 'REFUND' ; Destroy status IN ('COMPLETED','CLOSED')\n--   - Category attrs from latest dim_product snapshot, article-level DISTINCT\n--\n-- NOTE: sales and destroy are summed per day separately then FULL-joined on\n--       (date × article) so a destroy on a zero-sales day still appears (sales=0).\n-- ============================================================\nDECLARE current_end DATE DEFAULT current_date()-1;\nDECLARE ytd_start   DATE DEFAULT DATE_TRUNC(current_end, YEAR);  -- export whole YTD; dashboard slices within it\nDECLARE prod_dt     DATE DEFAULT current_date()-1;                   -- latest dim_product snapshot (D-1 ok)\n\nWITH grand_opening AS (\n  SELECT DISTINCT store_code, sale_date AS go_day\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_sales_target`\n  WHERE day_type = 'สาขาเปิดใหม่'\n    AND sale_date BETWEEN ytd_start AND current_end\n    AND store_code NOT LIKE 'CJXSMA%'\n),\n\nproduct_dim AS (\n  SELECT DISTINCT article_no, product_name, family, class, sub_class\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n  WHERE dt = prod_dt\n),\n\n-- daily per-article sales + RTC (Grand Opening excluded)\nsales_daily AS (\n  SELECT\n    s.receipt_date AS txn_date,\n    s.article_no,\n    SUM(s.after_refund_net_sale_amount_inc_vat) AS sales_inc,\n    SUM(s.after_refund_net_sale_amount_exc_vat) AS sales_exc,\n    SUM(IF(s.sale_type='REDUCE_TO_CLEAR', s.after_refund_net_sale_amount_inc_vat, 0)) AS rtc_value\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_sales` s\n  LEFT JOIN grand_opening g\n    ON s.store_code = g.store_code AND s.receipt_date = g.go_day\n  WHERE s.receipt_date BETWEEN ytd_start AND current_end\n    AND s.document_type != 'REFUND'\n    AND s.store_code LIKE 'CJX0%'\n    AND g.store_code IS NULL\n  GROUP BY 1, 2\n),\n\n-- daily per-article destroy (Grand Opening excluded)\ndestroy_daily AS (\n  SELECT\n    d.created_d AS txn_date,\n    d.article_no,\n    SUM(d.destroy_value) AS destroy_value\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_destroy` d\n  LEFT JOIN grand_opening g\n    ON d.store_code = g.store_code AND d.created_d = g.go_day\n  WHERE d.created_d BETWEEN ytd_start AND current_end\n    AND d.store_code LIKE 'CJX0%'\n    AND d.status IN ('COMPLETED','CLOSED')\n    AND g.store_code IS NULL\n  GROUP BY 1, 2\n)\n\nSELECT\n  COALESCE(sd.txn_date,  dd.txn_date)  AS txn_date,\n  COALESCE(sd.article_no, dd.article_no) AS article_no,\n  p.product_name,\n  p.family,\n  p.class,\n  p.sub_class,\n  COALESCE(sd.sales_inc,    0) AS sales_inc,      -- INC-VAT\n  COALESCE(sd.sales_exc,    0) AS sales_exc,      -- EX-VAT\n  COALESCE(sd.rtc_value,    0) AS rtc_value,      -- INC-VAT\n  COALESCE(dd.destroy_value, 0) AS destroy_value  -- EX-VAT cost\nFROM sales_daily sd\nFULL OUTER JOIN destroy_daily dd\n  ON sd.txn_date = dd.txn_date AND sd.article_no = dd.article_no\nLEFT JOIN product_dim p\n  ON COALESCE(sd.article_no, dd.article_no) = p.article_no\nORDER BY txn_date, article_no"}, {"id": "1782288540506", "name": "CJX Fair Date", "type": "BigQuery", "desc": "return fair date and fair type of each store", "code": "SELECT distinct\n  store_code\n  ,sale_date\n  ,day_type\nFROM `cjx-data-core.cjx_data_mart_prod.mart_console_sales_target` \nWHERE sale_date = \"2026-06-23\"\n  and store_code not like 'CJXSMA%'\nLIMIT 100"}, {"id": "1782271727106", "name": "CJX Clear Promotion CP1 CP2 CP3", "type": "BigQuery", "desc": "return all clear articles that still have stock and map promo cp1 cp2 cp3 with stock at start and end of promo date", "code": "WITH\n  dim AS (\n    SELECT DISTINCT\n      article_no, product_name, product_status\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n    WHERE dt = current_date() - 1\n      AND lower(product_status) LIKE 'clear%'\n      AND article_no LIKE '2%'\n  ),\n\n  first_clear AS (\n    SELECT article_no, min(dt) AS first_clear_date\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n    WHERE dt < current_date() - 1\n      AND lower(product_status) = 'clear'\n    GROUP BY article_no\n  ),\n\n  stock_today AS (\n    SELECT article_no, sum(available_qty) AS available_qty\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_store_stock`\n    WHERE movement_d = current_date() - 1\n      AND available_qty > 0\n      AND store_code LIKE 'CJX0%'\n    GROUP BY article_no\n  ),\n\n  promo AS (\n    SELECT\n      article_no,\n      CASE\n        WHEN upper(theme_name) LIKE '%CP1%' THEN 'CP1'\n        WHEN upper(theme_name) LIKE '%CP2%' THEN 'CP2'\n        WHEN upper(theme_name) LIKE '%CP3%' THEN 'CP3'\n      END AS cp_part,\n      theme_name,\n      date(promotion_effective_date_bkk) AS eff_date,\n      date(promotion_expire_date_bkk) AS exp_date,\n      retail_price_amount AS retail_price,\n      total_current_promotion_price_amount AS pro_price\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_promotion`\n    WHERE dt = current_date() - 1\n      AND source_system = 'CJX_NEST'\n      AND is_cancelled = FALSE\n      AND selected_store = 'ALL_STORE'\n      AND (upper(theme_name) LIKE '%CP1%'\n        OR upper(theme_name) LIKE '%CP2%'\n        OR upper(theme_name) LIKE '%CP3%')\n    QUALIFY row_number() OVER (\n      PARTITION BY article_no, cp_part\n      ORDER BY date(promotion_effective_date_bkk) DESC\n    ) = 1\n  ),\n\n  -- only the exact snapshot dates we need: each part's (eff-1) and (exp)\n  need_dates AS (\n    SELECT DISTINCT article_no, snap_d\n    FROM promo,\n    UNNEST([date_sub(eff_date, INTERVAL 1 DAY), exp_date]) AS snap_d\n    WHERE snap_d IS NOT NULL\n  ),\n\n  stock_hist AS (\n    SELECT s.article_no, s.movement_d, sum(s.available_qty) AS available_qty\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_store_stock` s\n    WHERE s.movement_d BETWEEN date_sub(current_date(), INTERVAL 12 MONTH)\n                           AND current_date() - 1\n      AND s.available_qty > 0\n      AND s.store_code LIKE 'CJX0%'\n    GROUP BY s.article_no, s.movement_d\n  )\n\nSELECT\n  d.article_no,\n  d.product_name,\n  d.product_status,\n  fc.first_clear_date,\n  st.available_qty AS available_qty_today,\n  countif(p.cp_part = 'CP1') > 0 AS has_cp1,\n  countif(p.cp_part = 'CP2') > 0 AS has_cp2,\n  countif(p.cp_part = 'CP3') > 0 AS has_cp3,\n  -- CP1\n  max(IF(p.cp_part='CP1', p.theme_name,   NULL)) AS cp1_theme_name,\n  max(IF(p.cp_part='CP1', p.eff_date,     NULL)) AS cp1_eff_date,\n  max(IF(p.cp_part='CP1', p.exp_date,     NULL)) AS cp1_exp_date,\n  max(IF(p.cp_part='CP1', p.retail_price, NULL)) AS cp1_retail_price,\n  max(IF(p.cp_part='CP1', p.pro_price,    NULL)) AS cp1_pro_price,\n  max(IF(p.cp_part='CP1', sb.available_qty, NULL)) AS cp1_stock_start,\n  max(IF(p.cp_part='CP1', se.available_qty, NULL)) AS cp1_stock_end,\n  -- CP2\n  max(IF(p.cp_part='CP2', p.theme_name,   NULL)) AS cp2_theme_name,\n  max(IF(p.cp_part='CP2', p.eff_date,     NULL)) AS cp2_eff_date,\n  max(IF(p.cp_part='CP2', p.exp_date,     NULL)) AS cp2_exp_date,\n  max(IF(p.cp_part='CP2', p.retail_price, NULL)) AS cp2_retail_price,\n  max(IF(p.cp_part='CP2', p.pro_price,    NULL)) AS cp2_pro_price,\n  max(IF(p.cp_part='CP2', sb.available_qty, NULL)) AS cp2_stock_start,\n  max(IF(p.cp_part='CP2', se.available_qty, NULL)) AS cp2_stock_end,\n  -- CP3\n  max(IF(p.cp_part='CP3', p.theme_name,   NULL)) AS cp3_theme_name,\n  max(IF(p.cp_part='CP3', p.eff_date,     NULL)) AS cp3_eff_date,\n  max(IF(p.cp_part='CP3', p.exp_date,     NULL)) AS cp3_exp_date,\n  max(IF(p.cp_part='CP3', p.retail_price, NULL)) AS cp3_retail_price,\n  max(IF(p.cp_part='CP3', p.pro_price,    NULL)) AS cp3_pro_price,\n  max(IF(p.cp_part='CP3', sb.available_qty, NULL)) AS cp3_stock_start,\n  max(IF(p.cp_part='CP3', se.available_qty, NULL)) AS cp3_stock_end\nFROM dim d\nJOIN stock_today st       ON st.article_no = d.article_no\nLEFT JOIN first_clear fc  ON fc.article_no = d.article_no\nLEFT JOIN promo p         ON p.article_no  = d.article_no\nLEFT JOIN stock_hist sb   ON sb.article_no = p.article_no\n                          AND sb.movement_d = date_sub(p.eff_date, INTERVAL 1 DAY)\nLEFT JOIN stock_hist se   ON se.article_no = p.article_no\n                          AND se.movement_d = p.exp_date\nGROUP BY\n  d.article_no, d.product_name, d.product_status,\n  fc.first_clear_date, st.available_qty\nORDER BY d.article_no\n--limit 10"}, {"id": "1782108287691", "name": "CJX Picking Change History", "type": "BigQuery", "desc": "return cjx picking change history with barcode and date", "code": "with dim as(\n  select distinct\n    article_no\n    ,barcode\n    ,product_name\n    ,product_status\n    ,family\n    ,class\n    ,sub_class\n    ,unit\n    ,unit_factor\n  from `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n  where dt = current_date()-1\n    and barcode_status = 'ACTIVE'\n),\n\nchanges as(\n  select distinct\n    nn.article_no\n    ,lag(nn.picking_unit_barcode,1) over(partition by nn.article_no order by nn.dt) as pick_from\n    ,nn.picking_unit_barcode as pick_to\n    ,nn.dt\n  from `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product` as nn\n  where nn.dt between '2026-06-18' and current_date()-1\n    --and nn.article_no like '2%'\n    and nn.product_name like '%ขยะ%'\n  qualify pick_from != pick_to\n)\n\nselect\n  c.article_no\n  ,d_to.product_name\n  ,d_to.product_status\n  ,c.pick_from\n  ,d_from.unit        as pick_from_unit\n  ,d_from.unit_factor as pick_from_unit_factor\n  ,c.pick_to\n  ,d_to.unit          as pick_to_unit\n  ,d_to.unit_factor   as pick_to_unit_factor\n  ,d_to.family\n  ,d_to.class\n  ,d_to.sub_class\n  ,c.dt\nfrom changes as c\nleft join dim as d_from on c.pick_from = d_from.barcode\nleft join dim as d_to   on c.pick_to   = d_to.barcode"}, {"id": "1782108206445", "name": "CJX Status Change History", "type": "BigQuery", "desc": "return cjx status change history with date", "code": "with dim as(\n  select distinct\n    article_no\n    ,product_name\n    ,family\n    ,class\n    ,sub_class\n  from `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n  where dt = current_date()-1\n)\n\nselect distinct\n  nn.article_no\n  ,dim.product_name\n  ,lag(nn.product_status,1) over(partition by dim.article_no order by nn.dt) as status_from\n  ,nn.product_status as status_to\n  ,dim.family\n  ,dim.class\n  ,dim.sub_class\n  ,nn.dt\nfrom `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product` as nn\nleft join dim on nn.article_no = dim.article_no\nwhere nn.dt between parse_date('%Y%m%d',@DS_START_DATE) and parse_date('%Y%m%d',@DS_END_DATE)\n\tand nn.article_no like '2%'\nqualify status_from != status_to"}, {"id": "1781850985487", "name": "CJX All Active Promotion", "type": "BigQuery", "desc": "return all active promotion", "code": "SELECT\n  promotion_code\n  ,theme_name\n  ,promotion_name\n  ,promotion_type\n  ,promotion_effective_date_bkk\n  ,promotion_expire_date_bkk\n  ,selected_store\n  ,article_no\n  ,barcode\n  ,product_name\n  ,unit, unit_factor\n  ,campaign_code\n  ,force_buy_qty_from, limit_per_bill, is_member_only\n  ,retail_price_amount\n  ,promotion_price_per_unit_cal\n  ,discount_percent\n  ,compensate_per_unit_amount\nFROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_promotion`\nWHERE\n  dt = current_date() - 1\n  AND is_cancelled = FALSE\n  AND source_system = 'CJX_NEST'\n  AND selected_store = 'ALL_STORE'\n  and promotion_effective_date_bkk <= current_date()\n  and promotion_expire_date_bkk > current_date()"}, {"id": "1781163885679", "name": "CJX New Promotion Added", "type": "BigQuery", "desc": "return new promotion created compared to last period", "code": "-- ============================================================\n-- NEW PROMOTIONS — present this Wed (dt=2026-06-10) but NOT last Thu (dt=2026-06-04)\n--   Grain: barcode level | Scope: ALL_STORE only | is_cancelled = false\n--   \"New\" = promotion_code in Wed snapshot, absent from Thu snapshot\n-- ============================================================\nDECLARE wed_dt DATE DEFAULT '2026-06-10';  -- this Wednesday\nDECLARE thu_dt DATE DEFAULT '2026-06-04';  -- last Thursday\n\nWITH wed AS (\n  SELECT\n    promotion_code, barcode, article_no, product_name,\n    promotion_name,group_no, promotion_type, theme_name,\n    promotion_effective_date_bkk, promotion_expire_date_bkk,\n    retail_price_amount, promotion_price_per_unit_cal,\n    discount_percent, compensate_per_unit_amount,\n    is_member_only, selected_store\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_promotion`\n  WHERE dt = wed_dt\n    AND is_cancelled = false\n    AND selected_store = 'ALL_STORE'\n    AND source_system = 'CJX_NEST'\n),\n\nthu_codes AS (\n  SELECT DISTINCT promotion_code\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_promotion`\n  WHERE dt = thu_dt\n    AND is_cancelled = false\n    AND selected_store = 'ALL_STORE'\n    AND source_system = 'CJX_NEST'\n)\n\nSELECT w.*\nFROM wed w\nLEFT JOIN thu_codes t USING (promotion_code)\nWHERE t.promotion_code IS NULL   -- code not present last Thursday = NEW\nORDER BY w.promotion_code, w.barcode"}, {"id": "1781146875927", "name": "CJX TD Tier Report", "type": "BigQuery", "desc": "CJX TD Tier Report", "code": "# tier TD\nWITH\n  dim AS (\n    SELECT DISTINCT\n      article_key,\n      product_name,\n      product_status AS status,\n      family,\n      class,\n      class_key,\n      sub_class,\n      sub_class_key\n    FROM `tdshop-prod.dimension.product`\n    WHERE\n      created_d = current_date() - 1\n      AND product_type = 'INVENTORY'\n      AND segment <> 'PROMOTION'\n  )\nSELECT\n  sa.article_no,\n  dim.product_name,\n  dim.status,\n  dim.family,\n  dim.class,\n  dim.class_key,\n  dim.sub_class,\n  dim.sub_class_key,\n  sum(after_refund_net_sale_amount_ex_vat) AS sale_ex,\n  sum(after_refund_total_sale_qty) AS total_qty\nFROM `tdshop-prod.fact.sales_receipt` AS sa\nLEFT JOIN dim\n  ON dim.article_key = sa.article_no\nWHERE\n  created_d\n    BETWEEN date_sub(date_trunc(current_date(), month), INTERVAL 3 month)\n    AND last_day(date_sub(current_date(), INTERVAL 1 month))\n  AND lower(dim.status) IN ('active', 'hold_buy', 'out_of_stock', 'new')\nGROUP BY 1, 2, 3, 4, 5, 6, 7, 8;\n\n# tier CJX\nWITH\n  dim AS (\n    SELECT DISTINCT\n      article_no,\n      product_name,\n      product_status AS status,\n      family,\n      class_key,\n      class,\n      sub_class_key,\n      sub_class\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n    WHERE dt = current_date() - 1\n  )\nSELECT\n  sa.article_no,\n  dim.product_name,\n  dim.status,\n  dim.family,\n  dim.class,\n  dim.class_key,\n  dim.sub_class,\n  dim.sub_class_key,\n  sum(after_refund_net_sale_amount_exc_vat) AS sale_ex,\n  sum(after_refund_total_sale_qty) AS total_qty\nFROM `cjx-data-core.cjx_data_mart_prod.mart_console_sales` AS sa\nLEFT JOIN dim\n  ON dim.article_no = sa.article_no\nWHERE\n  receipt_date\n    BETWEEN DATE_SUB(DATE_TRUNC(CURRENT_DATE(), MONTH), INTERVAL 3 MONTH)\n    AND LAST_DAY(DATE_SUB(CURRENT_DATE(), INTERVAL 1 MONTH))\n  AND lower(dim.status) IN ('active', 'hold_buy', 'out_of_stock', 'new')\n  AND sa.article_no LIKE '2%'\nGROUP BY 1, 2, 3, 4, 5, 6, 7, 8"}, {"id": "1781146789873", "name": "CJ NPD", "type": "BigQuery", "desc": "return cj npd with barcode and rsp", "code": "WITH yesterday AS (\n  SELECT\n    article_no,\n    product_name,\n    product_scm_status AS status,\n    barcode,\n    unit_code,\n    barcode_factor,\n    barcode_retail_price_1 AS rsp\n  FROM `tdshop-prod.cjx_gold.product_master`\n  WHERE dt = CURRENT_DATE() - 1\n),\nday_before AS (\n  SELECT distinct article_no\n  FROM `tdshop-prod.cjx_gold.product_master`\n  WHERE dt = CURRENT_DATE() - 2\n)\n\nSELECT *\nFROM yesterday\nWHERE article_no NOT IN (SELECT article_no FROM day_before)"}, {"id": "1781146374093", "name": "CJX Sales by Store by Article", "type": "BigQuery", "desc": "return sales by receipt by store by article with 60 days rolling limit", "code": "DECLARE end_date DATE DEFAULT @end_date;\n\nWITH dim AS (\n  SELECT DISTINCT\n    article_no,\n    product_name,\n    segment,\n    family,\n    class,\n    sub_class\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n  WHERE dt = CURRENT_DATE() - 1\n),\nst as(\n  select\n    store_code\n    ,store_name\n  from `cjx-data-core.cjx_data_mart_prod.mart_console_dim_store`\n  where dt = current_date()-1\n    and store_status = 'ACTIVE'\n)\n\nSELECT\n  s.receipt_date,\n  s.receipt_no,\n  s.article_no,\n  d.product_name,\n  d.family,\n  d.class,\n  d.sub_class,\n  s.store_code,\n  t.store_name,\n  s.member_id,\n  SUM(s.after_refund_net_sale_amount_exc_vat) AS sale_ex,\n  sum(after_refund_gross_profit_exc_vat+after_refund_compensate_supplier_amount_exc_vat) as gp_comp_ex\nFROM `cjx-data-core.cjx_data_mart_prod.mart_console_sales` s\nleft join dim d on d.article_no = s.article_no\nleft join st t on t.store_code = s.store_code\nWHERE s.receipt_date <= current_date()-1\n  and s.receipt_date between date_sub(@end_date, interval 60 day) and @end_date\nGROUP BY\n  s.receipt_date,\n  s.receipt_no,\n  s.article_no,\n  d.product_name,\n  d.family,\n  d.class,\n  d.sub_class,\n  s.store_code,\n  t.store_name,\n  s.member_id"}, {"id": "1781146094788", "name": "CJX Store Apply", "type": "BigQuery", "desc": "return store apply or number of pog by article", "code": "select\n  article_no\n  ,count(distinct store_code) as store_apply\nfrom `cjx-data-core.cjx_data_mart_prod.mart_console_dim_store_assortment`\nwhere status = 'ACTIVE'\ngroup by 1"}, {"id": "1781145608238", "name": "CJX Cur Status Days", "type": "BigQuery", "desc": "return current status start date and consecutive days", "code": "WITH base AS (\n  SELECT distinct\n    article_no,\n    dt,\n    LOWER(product_status) AS status,\n\n    LAST_VALUE(LOWER(product_status)) OVER (\n      PARTITION BY article_no\n      ORDER BY dt\n      ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING\n    ) AS current_status --current status together with that day status\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n  where dt between '2025-12-01' and '2026-01-19'\n),\nflag as (\n  SELECT\n    *,\n    CASE\n        WHEN LAG(status) OVER (\n          PARTITION BY article_no\n          ORDER BY dt\n        ) != status\n        OR LAG(status) OVER (\n          PARTITION BY article_no\n          ORDER BY dt\n        ) IS NULL\n        THEN 1\n        ELSE 0\n      END AS break_flag\n  FROM base --flag if there is the difference in status\n),\ngrp AS (\n  SELECT\n    *,\n    SUM(break_flag) OVER (\n      PARTITION BY article_no\n      ORDER BY dt\n      ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n    ) AS grp_id\n  FROM flag\n),\ncurrent_grp AS (\n  SELECT\n    article_no,\n    MAX(grp_id) AS grp_id\n  FROM grp\n  GROUP BY article_no\n)\nSELECT\n  g.article_no,\n  g.status,\n  MIN(g.dt) AS status_start_date,\n  DATE_DIFF(MAX(g.dt), MIN(g.dt), DAY) + 1 AS consecutive_days\nFROM grp g\nJOIN current_grp c\n  ON g.article_no = c.article_no\n AND g.grp_id     = c.grp_id\nWHERE g.article_no = '20057037'\nGROUP BY g.article_no, g.status\nORDER BY g.article_no;"}, {"id": "1781145333231", "name": "CJX Assortment", "type": "BigQuery", "desc": "contain 4 queries; 1. assortment type change date 2. assortment type by store by article 3. last day in last assortment type 4. full assortment by store by article", "code": "--assortment type change date\nselect\n  store_code, store_name, store_status\n  ,article_no, product_name\n  ,as_of_date\n  ,lag(assortment_type,1) over(partition by store_code,article_no order by as_of_date) as type_from\n  ,assortment_type as type_to\nfrom `cjx-data-core.cjx_data_mart_prod.mart_store_assortment_store`\nwhere as_of_date between '2025-10-01' and '2025-11-30'\n  and article_no in ('20051515','20051516','20053148')\n  and store_code in ('CJX00005'/*,'CJX00009','CJX00014','CJX00020','CJX00035','CJX00054','CJX00060'*/)\nqualify type_from != type_to\norder by 1,4,6 desc\n;\n--assortment type by store by article\nselect\n  store_code, store_name, store_status\n  ,article_no, product_name\n  ,as_of_date\n  ,assortment_type\nfrom `cjx-data-core.cjx_data_mart_prod.mart_store_assortment_store`\nwhere as_of_date between '2025-11-01' and '2025-11-30'\n  and article_no in ('20051515','20051516','20053148')\n  and store_code in ('CJX00035','CJX00009','CJX00014','CJX00020','CJX00005','CJX00054','CJX00060')\norder by 4,6 desc\n;\n--last day in last assortment type\nSELECT *\nFROM(\nSELECT as_of_date,\n  article_no,\n  store_code,\n  store_assortment_status,\n  assortment_type,\n  1 AS store_pog,\n  LAG(store_assortment_status) OVER(PARTITION BY article_no, store_code ORDER BY as_of_date DESC) next_status\nFROM `cjx-data-core.cjx_data_mart_prod.mart_store_assortment_store`\nWHERE as_of_date >= '2025-11-10'\n  AND article_no in ('20051515','20051516','20053148')\n  AND store_code in ('CJX00035','CJX00009','CJX00014','CJX00020','CJX00005','CJX00054','CJX00060')\n)\nWHERE next_status IS NULL;\n\n--full assortment by store by article\nSELECT distinct\n  store_code\n  ,store_name\n  ,article_no\n  ,product_name\n  ,store_assortment_status\n  ,assortment_type\n  ,store_assortment_replenishment_status\n  ,is_permanent_hold\n  ,is_conflict_store_condition\n  ,true_assortment_replenishment_status\n  ,true_assortment_status\nFROM `cjx-data-core.cjx_data_mart_prod.mart_store_assortment_store` \nWHERE as_of_date = current_date()-1\n  and store_assortment_status = 'ACTIVE'\norder by 3,1\nlimit 100"}, {"id": "1781145062597", "name": "CJX Shelf by Store by Article", "type": "BigQuery", "desc": "cjx shelf by store by article", "code": "select\n  store_code\n  ,store_name\n  ,store_status\n  ,shelf_code\n  ,shelf_name\n  ,shelf_type_name\n  ,article_no\n  ,barcode\n  ,product_name\n  ,product_status\n  ,status as assort_status\n  ,type as assort_type\n  ,family\n  ,class\n  ,sub_class\nfrom `cjx-data-core.cjx_data_mart_prod.mart_console_dim_store_assortment`\nwhere status = 'ACTIVE'\nlimit 100"}, {"id": "1781144805777", "name": "CJX Fresh Lite", "type": "BigQuery", "desc": "cjx fresh lite; contain 2 queries 1. return supplier price by article 2. return store count by article", "code": "#cost by sup by article\n-- 1) ดึงราคาจาก fre เฉพาะคอลัมน์ที่ใช้ และกรองให้แคบตั้งแต่ต้น\nWITH fre_raw AS (\n  SELECT\n    article_no,\n    order_barcode,\n    order_unit,\n    base_qty,\n    order_from_code AS sup_code,\n    order_from_name AS sup_name,\n    unit_price_amount,\n    CAST(valid_from AS DATE) AS eff_date,\n    CAST(valid_to   AS DATE) AS exp_date\n  FROM `cjx-data-core.cjx_ods_prod.nest__article_store_price_config`\n  WHERE article_no LIKE '2%'\n    -- ถ้าต้องการเฉพาะราคาที่มีผล \"วันนี้\" จะช่วยลดแถวได้มาก\n    -- AND DATE(valid_from) <= CURRENT_DATE()-1\n    AND DATE(valid_to) > CURRENT_DATE()-1\n),\n\n-- 2) สร้างกุญแจเฉพาะ article_no ที่มีใน fre (ช่วยให้ฝั่ง dim เล็กลง)\nkeys AS (\n  SELECT DISTINCT article_no FROM fre_raw\n),\n\n-- 3) สรุปราคาใน fre ให้เหลือ 1 แถวต่อคอมโบที่ต้องการโชว์\n--    (ถ้าเอา \"ราคา max\" ต่อคอมโบ ให้ aggregate ตรงนี้)\nfre AS (\n  SELECT\n    article_no,\n    order_barcode,\n    order_unit,\n    base_qty,\n    sup_code,\n    sup_name,\n    MAX(unit_price_amount) AS sup_price,   -- 👈 รวมที่นี่\n    eff_date,\n    exp_date\n  FROM fre_raw\n  GROUP BY\n    article_no, order_barcode, order_unit, base_qty,\n    sup_code, sup_name, eff_date, exp_date\n),\n\n-- 4) dim: เลือกคอลัมน์เท่าที่ใช้ + บีบเหลือ 1 แถว/ article_no\ndim AS (\n  SELECT\n    d.article_no,\n    ANY_VALUE(d.product_name)   AS product_name,\n    ANY_VALUE(d.product_status) AS product_status,\n    ANY_VALUE(d.brand)          AS brand,\n    ANY_VALUE(d.family)         AS family,\n    ANY_VALUE(d.class)          AS class\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product` d\n  JOIN keys k USING (article_no)                  -- 👈 กรองด้วยกุญแจก่อน\n  WHERE d.dt = CURRENT_DATE()-1\n    AND d.barcode_status = 'ACTIVE'\n    AND d.unit_factor = 1\n    AND d.fresh_lite_category IS TRUE\n  GROUP BY d.article_no\n)\n\n-- 5) join จริง: ไม่ต้อง GROUP BY ซ้ำ\nSELECT\n  d.article_no,\n  d.product_name,\n  d.product_status,\n  d.brand,\n  d.family,\n  d.class,\n  f.order_barcode,\n  f.order_unit,\n  f.base_qty,\n  f.sup_code,\n  f.sup_name,\n  f.sup_price,       -- ได้ราคาที่ MAX มาแล้ว\n  f.eff_date,\n  f.exp_date\nFROM dim d\nLEFT JOIN fre f USING (article_no);\n-- ถ้าจะดูตัวอย่างค่อยใส่ LIMIT 10 ที่ท้ายสุด\n\n\n#store count per article\n-- 1) ดึงราคาจาก fre เฉพาะคอลัมน์ที่ใช้ และกรองให้แคบตั้งแต่ต้น\nWITH fre_raw AS (\n  SELECT\n    article_no,\n    ship_to_code\n  FROM `cjx-data-core.cjx_ods_prod.nest__article_store_price_config`\n  WHERE article_no LIKE '2%'\n    -- ถ้าต้องการเฉพาะราคาที่มีผล \"วันนี้\" จะช่วยลดแถวได้มาก\n    -- AND DATE(valid_from) <= CURRENT_DATE()-1\n    AND DATE(valid_to) > CURRENT_DATE()-1\n),\n\n-- 2) สร้างกุญแจเฉพาะ article_no ที่มีใน fre (ช่วยให้ฝั่ง dim เล็กลง)\nkeys AS (\n  SELECT DISTINCT article_no FROM fre_raw\n),\n\n-- 3) สรุปราคาใน fre ให้เหลือ 1 แถวต่อคอมโบที่ต้องการโชว์\n--    (ถ้าเอา \"ราคา max\" ต่อคอมโบ ให้ aggregate ตรงนี้)\nfre AS (\n  SELECT\n    article_no,\n    count(distinct ship_to_code) as store\n  FROM fre_raw\n  GROUP BY\n    article_no\n),\n\n-- 4) dim: เลือกคอลัมน์เท่าที่ใช้ + บีบเหลือ 1 แถว/ article_no\ndim AS (\n  SELECT\n    d.article_no,\n    ANY_VALUE(d.product_name)   AS product_name,\n    ANY_VALUE(d.product_status) AS product_status,\n    ANY_VALUE(d.brand)          AS brand,\n    ANY_VALUE(d.family)         AS family,\n    ANY_VALUE(d.class)          AS class\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product` d\n  JOIN keys k USING (article_no)                  -- 👈 กรองด้วยกุญแจก่อน\n  WHERE d.dt = CURRENT_DATE()-1\n    AND d.barcode_status = 'ACTIVE'\n    AND d.unit_factor = 1\n    AND d.fresh_lite_category IS TRUE\n  GROUP BY d.article_no\n)\n\n-- 5) join จริง: ไม่ต้อง GROUP BY ซ้ำ\nSELECT\n  d.article_no,\n  d.product_name,\n  d.product_status,\n  d.brand,\n  d.family,\n  d.class,\n  f.store\nFROM dim d\nLEFT JOIN fre f USING (article_no);\n-- ถ้าจะดูตัวอย่างค่อยใส่ LIMIT 10 ที่ท้ายสุด"}, {"id": "1781144745860", "name": "CJX CJ Tab", "type": "BigQuery", "desc": "cjx_cj_tab", "code": "select distinct\n  article_no\n ,source_supplier_code\n ,source_supplier_name\nfrom `cjx-data-core.cjx_dwh_assortment_prod.dim_vendor_price_v1`\nwhere location_level_type = 'ALL_DCS'\n  and article_no = '20050460'"}, {"id": "1781144678639", "name": "cjx max cost", "type": "BigQuery", "desc": "cjx max cost", "code": "SELECT distinct\n  article_no\n  ,maximum_normal_price_amount as max_cost\nFROM `cjx-data-core.cjx_dwh_assortment_prod.dim_product_barcode_v1`"}, {"id": "1781144521695", "name": "cjx_scm_ros", "type": "BigQuery", "desc": "cjx scm ros", "code": "select\n  article_no\n  ,as_of_date\n  ,avg(cjx_ros_qty_data_point_ex_event_period) as ros\nfrom `cjx-data-core.cjx_data_mart_prod.mart_ros_average_sales`\nwhere as_of_date = current_date()-1\ngroup by 1,2"}, {"id": "1781079424035", "name": "CJX Category Performance DB_Summary Page", "type": "BigQuery", "desc": "return file for claude to build cjx category performance summary page (6 cards and 3 graphs)", "code": "-- ============================================================\n-- COMBINED QUERY — 6 Summary Cards + Daily Chart Series\n-- One result set, tagged by `row_type`:\n--   'CARD'  → single row, all 6 KPI cards (CUR/LY/growth/pts)\n--   'DAILY' → one row per day, cumulative series for the 3 charts\n--\n-- Frontend: filter WHERE row_type = 'CARD' for cards,\n--           WHERE row_type = 'DAILY' ORDER BY day for charts.\n--\n-- Locked rules respected:\n--   - Sales & BPSD: inc-VAT  |  GP / RTC / Destroy / Net: ex-VAT\n--   - Store exclusion: Grand Opening only (fair_type LIKE '%เปิดใหม่%'), CUR + LY\n--   - BPSD denom = COUNT(DISTINCT store_code × receipt_date)\n--   - %GP NET = FRONT - RTC - DESTROY (derived)\n--   - Destroy status IN ('COMPLETED','CLOSED'); destroy_value ex-VAT\n--   - NO COALESCE on destroy LY (vs-LY = N/A when LY < 2025-06)\n-- ============================================================\nDECLARE current_end   DATE DEFAULT '2026-06-30';\nDECLARE current_start DATE DEFAULT DATE_SUB(current_end, INTERVAL 31 DAY);  -- D-1 data: full 30 days of populated data\nDECLARE ly_start DATE DEFAULT DATE_SUB(current_start, INTERVAL 1 YEAR);\nDECLARE ly_end   DATE DEFAULT DATE_SUB(current_end,   INTERVAL 1 YEAR);\n\nWITH grand_opening AS (\n  SELECT store_code, go_day\n  FROM `tdshop-data-business-units-com.commercial_sandbox.SMA_Fair_Date`,\n  UNNEST(GENERATE_DATE_ARRAY(start_date, end_date)) AS go_day\n  WHERE fair_type LIKE '%เปิดใหม่%'\n),\n\n-- ============================================================\n-- SHARED SALES BASE (CUR + LY)\n-- ============================================================\nsales_base AS (\n  SELECT\n    CASE WHEN s.receipt_date BETWEEN current_start AND current_end THEN 'CUR'\n         WHEN s.receipt_date BETWEEN ly_start AND ly_end           THEN 'LY' END AS period,\n    s.store_code, s.receipt_date,\n    s.after_refund_net_sale_amount_inc_vat AS sales_inc,\n    s.after_refund_net_sale_amount_exc_vat AS sales_exc,\n    s.after_refund_gross_profit_exc_vat    AS gp_front_exc,\n    IF(s.sale_type='REDUCE_TO_CLEAR', s.after_refund_net_sale_amount_exc_vat, 0) AS rtc_sales_exc\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_sales` s\n  LEFT JOIN grand_opening g ON s.store_code=g.store_code AND s.receipt_date=g.go_day\n  WHERE (s.receipt_date BETWEEN current_start AND current_end\n      OR s.receipt_date BETWEEN ly_start AND ly_end)\n    AND s.document_type != 'REFUND' AND s.store_code LIKE 'CJX0%'\n    AND g.store_code IS NULL\n),\n\n-- ============================================================\n-- CARD AGGREGATES (period-level)\n-- ============================================================\nsales_agg AS (\n  SELECT period,\n    SUM(sales_inc) AS total_sales_inc, SUM(sales_exc) AS total_sales_exc,\n    SUM(gp_front_exc) AS gp_front_exc, SUM(rtc_sales_exc) AS rtc_sales_exc,\n    COUNT(DISTINCT CONCAT(store_code,'|',CAST(receipt_date AS STRING))) AS store_days\n  FROM sales_base WHERE period IS NOT NULL GROUP BY period\n),\ndestroy_base AS (\n  SELECT\n    CASE WHEN d.created_d BETWEEN current_start AND current_end THEN 'CUR'\n         WHEN d.created_d BETWEEN ly_start AND ly_end           THEN 'LY' END AS period,\n    d.destroy_value\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_destroy` d\n  LEFT JOIN grand_opening g ON d.store_code=g.store_code AND d.created_d=g.go_day\n  WHERE (d.created_d BETWEEN current_start AND current_end\n      OR d.created_d BETWEEN ly_start AND ly_end)\n    AND d.store_code LIKE 'CJX0%' AND d.status IN ('COMPLETED','CLOSED')\n    AND g.store_code IS NULL\n),\ndestroy_agg AS (\n  SELECT period, SUM(destroy_value) AS destroy_value_exc\n  FROM destroy_base WHERE period IS NOT NULL GROUP BY period\n),\nmetrics AS (\n  SELECT s.period, s.total_sales_inc, s.store_days,\n    SAFE_DIVIDE(s.total_sales_inc, s.store_days)        AS bpsd,\n    SAFE_DIVIDE(s.gp_front_exc,  s.total_sales_exc)     AS gp_front_pct,\n    SAFE_DIVIDE(s.rtc_sales_exc, s.total_sales_exc)     AS rtc_pct,\n    SAFE_DIVIDE(d.destroy_value_exc, s.total_sales_exc) AS destroy_pct\n  FROM sales_agg s LEFT JOIN destroy_agg d USING (period)\n),\ncard_row AS (\n  SELECT\n    'CARD' AS row_type,\n    CAST(NULL AS DATE) AS day,\n    -- TOTAL SALES (AMT)\n    MAX(IF(period='CUR',total_sales_inc,NULL)) AS total_sales_cur,\n    MAX(IF(period='LY', total_sales_inc,NULL)) AS total_sales_ly,\n    SAFE_DIVIDE(MAX(IF(period='CUR',total_sales_inc,NULL))-MAX(IF(period='LY',total_sales_inc,NULL)),\n                MAX(IF(period='LY',total_sales_inc,NULL)))            AS total_sales_growth,\n    -- BPSD\n    MAX(IF(period='CUR',bpsd,NULL)) AS bpsd_cur,\n    MAX(IF(period='LY', bpsd,NULL)) AS bpsd_ly,\n    SAFE_DIVIDE(MAX(IF(period='CUR',bpsd,NULL))-MAX(IF(period='LY',bpsd,NULL)),\n                MAX(IF(period='LY',bpsd,NULL)))                       AS bpsd_growth,\n    -- %GP FRONT (pts)\n    MAX(IF(period='CUR',gp_front_pct,NULL)) AS gp_front_cur,\n    MAX(IF(period='LY', gp_front_pct,NULL)) AS gp_front_ly,\n    MAX(IF(period='CUR',gp_front_pct,NULL))-MAX(IF(period='LY',gp_front_pct,NULL)) AS gp_front_pts,\n    -- %RTC (pts)\n    MAX(IF(period='CUR',rtc_pct,NULL)) AS rtc_cur,\n    MAX(IF(period='LY', rtc_pct,NULL)) AS rtc_ly,\n    MAX(IF(period='CUR',rtc_pct,NULL))-MAX(IF(period='LY',rtc_pct,NULL)) AS rtc_pts,\n    -- %DESTROY (pts)\n    MAX(IF(period='CUR',destroy_pct,NULL)) AS destroy_cur,\n    MAX(IF(period='LY', destroy_pct,NULL)) AS destroy_ly,\n    MAX(IF(period='CUR',destroy_pct,NULL))-MAX(IF(period='LY',destroy_pct,NULL)) AS destroy_pts,\n    -- %GP NET = FRONT - RTC - DESTROY\n    (MAX(IF(period='CUR',gp_front_pct,NULL))-MAX(IF(period='CUR',rtc_pct,NULL))-MAX(IF(period='CUR',destroy_pct,NULL))) AS gp_net_cur,\n    (MAX(IF(period='LY', gp_front_pct,NULL))-MAX(IF(period='LY', rtc_pct,NULL))-MAX(IF(period='LY', destroy_pct,NULL))) AS gp_net_ly,\n    -- daily-only columns (null on card row)\n    CAST(NULL AS FLOAT64) AS cum_sales_inc,\n    CAST(NULL AS FLOAT64) AS cum_gp_exc,\n    CAST(NULL AS FLOAT64) AS cum_gp_front_pct\n  FROM metrics\n),\n\n-- ============================================================\n-- DAILY SERIES (CUR period only) — for the 3 charts\n-- ============================================================\nsales_daily AS (\n  SELECT\n    receipt_date AS day,\n    SUM(sales_inc)    AS sales_inc,\n    SUM(sales_exc)    AS sales_exc,\n    SUM(gp_front_exc) AS gp_front_exc\n  FROM sales_base\n  WHERE period = 'CUR'\n  GROUP BY 1\n),\ndaily_rows AS (\n  SELECT\n    'DAILY' AS row_type,\n    day,\n    -- card-only columns (null on daily rows)\n    CAST(NULL AS FLOAT64) AS total_sales_cur, CAST(NULL AS FLOAT64) AS total_sales_ly, CAST(NULL AS FLOAT64) AS total_sales_growth,\n    CAST(NULL AS FLOAT64) AS bpsd_cur, CAST(NULL AS FLOAT64) AS bpsd_ly, CAST(NULL AS FLOAT64) AS bpsd_growth,\n    CAST(NULL AS FLOAT64) AS gp_front_cur, CAST(NULL AS FLOAT64) AS gp_front_ly, CAST(NULL AS FLOAT64) AS gp_front_pts,\n    CAST(NULL AS FLOAT64) AS rtc_cur, CAST(NULL AS FLOAT64) AS rtc_ly, CAST(NULL AS FLOAT64) AS rtc_pts,\n    CAST(NULL AS FLOAT64) AS destroy_cur, CAST(NULL AS FLOAT64) AS destroy_ly, CAST(NULL AS FLOAT64) AS destroy_pts,\n    CAST(NULL AS FLOAT64) AS gp_net_cur, CAST(NULL AS FLOAT64) AS gp_net_ly,\n    -- daily cumulative series\n    SUM(sales_inc)    OVER (ORDER BY day) AS cum_sales_inc,                       -- chart 1: Sales (inc-VAT)\n    SUM(gp_front_exc) OVER (ORDER BY day) AS cum_gp_exc,                          -- chart 2: GP Baht (ex-VAT)\n    SAFE_DIVIDE(SUM(gp_front_exc) OVER (ORDER BY day),\n                SUM(sales_exc)    OVER (ORDER BY day)) AS cum_gp_front_pct        -- chart 3: GP% to-date (ex-VAT)\n  FROM sales_daily\n)\n\nSELECT * FROM card_row\nUNION ALL\nSELECT * FROM daily_rows\nORDER BY row_type, day;  -- CARD first (day NULL), then DAILY ascending"}, {"id": "1780988429821", "name": "CJ Status Change History", "type": "BigQuery", "desc": "return cj status and date change", "code": "with daily as (\n  select distinct\n    dt\n    ,article_no\n    ,product_name\n    ,product_scm_status as status\n  from `tdshop-prod.cjx_gold.product_master`\n  where dt between parse_date('%Y%m%d',@DS_START_DATE) and parse_date('%Y%m%d',@DS_END_DATE)\n)\n\nselect\n  dt as date\n  ,regexp_replace(article_no,r'^0+','') as article_no\n  ,product_name\n  ,lag(status,1) over(partition by article_no order by dt) as status_from\n  ,status as status_to\nfrom daily\nqualify status_to != status_from\norder by 2,1 desc"}, {"id": "1780556104810", "name": "CJ First Clear Date", "type": "BigQuery", "desc": "return cj first date to change status to clear", "code": "SELECT\n  article_no,\n  product_name,\n  status,\n  MIN(dt) AS first_c_status_date\nFROM (\n  SELECT DISTINCT\n    regexp_replace(article_no,r'^0+','') as article_no,\n    product_name,\n    product_scm_status AS status,\n    dt\n  FROM `tdshop-prod.cjx_gold.product_master`\n  WHERE dt between '2023-01-01' and current_date()-1\n    and STARTS_WITH(product_scm_status, 'C')\n    and regexp_replace(article_no,r'^0+','') in ('20001356','20030907','20032348','20041133')\n)\nGROUP BY article_no, product_name, status\nORDER BY article_no, first_c_status_date"}, {"id": "1780306426940", "name": "CJX Reason for Status Change", "type": "BigQuery", "desc": "return reason by article for status change", "code": "select distinct\n  article_no\n  ,product_status\n  ,reason_for_change_status\n  ,dbt_valid_from\n  ,dbt_valid_to\nfrom `cjx-data-core.cjx_snp_assortment_prod.dim_product_barcode_snapshot_v1`\nwhere product_status = 'HOLD_BUY'\n  and date(dbt_valid_from) between '2026-04-10' and current_date()-1\n  and reason_for_change_status is not null\norder by 1,4 desc"}, {"id": "1780029333406", "name": "TD Assortment by Store", "type": "BigQuery", "desc": "TD Assortment by Store", "code": "SELECT \n  store_code\n  ,store_name\n  ,article_no\n  ,product_name\n  ,product_status\n  ,assortment_type\n  ,true_assortment_article_status\n  ,store_status\n  ,is_permanent_hold\n  ,is_conflict_store_condition\nFROM `tdshop-prod.mart.store_assortment_by_article` \nWHERE as_of_date = current_date()-1\n\tand store_code like 'TH%'\n  and store_status = 'ACTIVE'"}, {"id": "1779868623228", "name": "Filter Date D-60", "type": "Power Query", "desc": "return days after today for 60 days", "code": "= Table.SelectRows(#\"Sorted Rows\", each [Valid From] > Date.AddDays(DateTime.Date(DateTime.LocalNow()), -60))"}, {"id": "1779854119214", "name": "CJX Moving History", "type": "BigQuery", "desc": "return moving history date range", "code": "select distinct\n  article_no\n  ,moving_avg_cost_base_unit\n  ,date(dbt_valid_from) as eff_date\n  ,date(dbt_valid_to) as end_date\nfrom `cjx-data-core.cjx_snp_assortment_prod.dim_product_barcode_snapshot_v1`\nwhere article_no in ('20063813','20063814')\n  and date(dbt_valid_from) between '2026-04-10' and current_date()-1\norder by 1,3"}, {"id": "1779420312542", "name": "TD Cost History", "type": "BigQuery", "desc": "return td cost history by article", "code": "SELECT DISTINCT\n  article_no,\n  order_from_code AS sup_code,\n  order_from_name AS sup_name,\n  unit_price,\n  date(effective_date) as eff_date,\n  date(expire_date) as exp_date\nFROM `tdshop-prod.publish_assortment.td_nest_product_supplier_price_by_dc`\nWHERE dt BETWEEN '2025-01-01' AND current_date() - 1\n  and article_no = '20059684'\norder by 6 desc"}, {"id": "1778652532891", "name": "CJX Moving by Barcode", "type": "BigQuery", "desc": "cjx moving ex vat by barcode", "code": "select\n  article_no\n  ,barcode\n  ,moving_avg_cost_base_unit\nfrom `cjx-data-core.cjx_dwh_assortment_prod.dim_product_barcode_v1`\nlimit 10"}, {"id": "1778561913380", "name": "Apply Conditional Formatting", "type": "VBA", "desc": "apply conditional formatting if gp value is less than 0, font color red and bg color light pink", "code": "Sub cjx_pro_format()\n    Dim ws As Worksheet\n    Dim lastCol As Long\n    Dim lastRow As Long\n    Dim applyRange As Range\n    Dim colLetter As String\n    \n    Set ws = ActiveSheet\n    \n    ' ËÒ last column ¨Ò¡ header row 1\n    lastCol = ws.Cells(1, ws.Columns.Count).End(xlToLeft).Column\n    \n    ' ËÒ last row ¨Ò¡ column AJ (column 36)\n    lastRow = ws.Cells(ws.Rows.Count, 36).End(xlUp).Row\n    \n    ' ¡ÓË¹´ range ·Õè¨Ð apply (A2 ¶Ö§ last col, last row)\n    Set applyRange = ws.Range(ws.Cells(2, 1), ws.Cells(lastRow, lastCol))\n    \n    ' ÅéÒ§ conditional formatting à´ÔÁã¹ range ¹Õé¡èÍ¹\n    applyRange.FormatConditions.Delete\n    \n    ' à¾ÔèÁ conditional formatting\n    ' Formula: $AJ2 < 0 (lock column AJ, äÁè lock row)\n    With applyRange.FormatConditions.Add( _\n        Type:=xlExpression, _\n        Formula1:=\"=$AJ2<0\")\n        .Interior.Color = RGB(255, 215, 215)   ' ÊÕá´§\n        .Font.Color = RGB(192, 0, 0)   ' µÑÇÍÑ¡ÉÃ¢ÒÇ (optional)\n    End With\n    \n    MsgBox \"Done! Applied to A2:\" & ws.Cells(lastRow, lastCol).Address(False, False), vbInformation\nEnd Sub"}, {"id": "1778561825720", "name": "Format Sheet Autofit and Unwrap Text", "type": "VBA", "desc": "format sheet, change font to cordia new 14, unwrap text and autofit row and column", "code": "Sub FormatSheet()\n    Dim ws As Worksheet\n    Dim usedRng As Range\n    \n    Set ws = ActiveSheet\n    Set usedRng = ws.UsedRange\n    \n    ' 1. Remove wrap text\n    usedRng.WrapText = False\n    \n    ' 2. Change font\n    usedRng.Font.Name = \"Cordia New\"\n    usedRng.Font.Size = 14\n    \n    ' 3. Autofit columns and rows\n    usedRng.Columns.AutoFit\n    usedRng.Rows.AutoFit\n    \nEnd Sub"}, {"id": "1778494941237", "name": "CJX Moving by Store by Article", "type": "BigQuery", "desc": "cjx moving cost by store by article", "code": "SELECT \n  store_code\n  ,article_no\n  ,moving_cost\nFROM `cjx-data-core.cjx_data_mart_prod.mart_console_store_stock`\nWHERE movement_d = current_date()-1\n  and article_no like '2%'\n  and store_code like 'CJX0%'"}, {"id": "1778494802211", "name": "CJX Shelf with No Store", "type": "BigQuery", "desc": "return shelf and article with no store active", "code": "with st as(\n  select\n    article_no\n    ,shelf_code\n    ,count(distinct store_code) as cnt_store\n  from `cjx-data-core.cjx_data_mart_prod.mart_console_dim_store_assortment`\n  where status = 'ACTIVE'\n  group by 1,2\n)\n\nSELECT\n  sh.shelf_code\n  ,shelf_name\n  ,sh.article_no\n  ,product_name\n  ,st.cnt_store\nFROM `cjx-data-core.cjx_dwh_assortment_prod.dim_shelf_inventory_v1` AS sh\nleft join st on st.article_no = sh.article_no and sh.shelf_code = st.shelf_code\nwhere shelf_status = 'ACTIVE'\n  and st.cnt_store is null\n  --and sh.article_no in ('20001587','20001586')"}, {"id": "1778231940442", "name": "CJX Destroy Transaction", "type": "BigQuery", "desc": "return destroy transaction by store by barcode and stamp reason", "code": "select\n  store_code\n  ,store_name\n  ,status\n  ,article_no\n  ,barcode\n  ,created_d\n  ,destroy_qty_by_reason\n  ,destroy_value\n  ,reason\nfrom `cjx-data-core.cjx_data_mart_prod.mart_console_destroy`\nwhere created_d between '2026-02-01' and '2026-03-31'\n  and store_code in ('CJX00081','CJX00071','CJX00082','CJX00084','CJX00093','CJX00104','CJX00087','CJX00107','CJX00103','CJX00100','CJX00099','CJX00090','CJX00110','CJX00095','CJX00109','CJX00108')"}, {"id": "1777968446113", "name": "CJX RSP Change Tracking", "type": "BigQuery", "desc": "return date rsp price change and rsp_from and rsp_to", "code": "with cjx as(\n  select distinct\n    article_no\n    ,product_name\n    ,product_status as status\n  from `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n  where dt = current_date()-1\n)\n\nselect distinct\n  dim.dt as date\n  ,dim.article_no\n  ,cjx.product_name\n  ,cjx.status\n  ,dim.barcode\n  ,dim.unit\n  ,dim.unit_factor\n  ,lag(dim.retail_price_inc_vat,1) over(partition by dim.barcode order by dim.dt) as rsp_from\n  ,dim.retail_price_inc_vat as rsp_to\nfrom `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product` as dim\nleft join cjx on cjx.article_no = dim.article_no\nwhere dt between '2026-04-01' and '2026-04-30'\n  --and dim.article_no like '%20016742'\nqualify rsp_to != rsp_from\norder by 2,7,1 desc"}, {"id": "1777968302235", "name": "CJX NPD by Date", "type": "BigQuery", "desc": "return article and date first created npd in the system, edit month and year that interested in", "code": "SELECT\n  t.article_no,\n  MIN(t.product_name) AS product_name,\n  first.first_seen_dt\nFROM (\n  SELECT\n    article_no,\n    MIN(dt) AS first_seen_dt\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n  WHERE dt >= '2026-01-01'\n    AND article_no LIKE '2%'\n  GROUP BY article_no\n  HAVING EXTRACT(MONTH FROM MIN(dt)) = 4\n     AND EXTRACT(YEAR FROM MIN(dt)) = 2026\n) first\nJOIN `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product` t\n  ON t.article_no = first.article_no\n  AND t.dt = CURRENT_DATE() - 1\nGROUP BY t.article_no, first.first_seen_dt"}, {"id": "1776411376318", "name": "CJX Clear with Promotion, ROS and Stock", "type": "BigQuery", "desc": "cjx return clear start and end date, rsp at clear start date, clear promotion period, ros and stock qty at pro start date", "code": "WITH\n  hist AS (\n    SELECT\n      t.article_no,\n      t.dt,\n      lower(t.product_status) AS status,\n      t.retail_price_inc_vat,\n      t.unit_factor\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product` t\n    WHERE t.dt <= current_date() - 1\n      AND lower(t.product_status) = 'clear'\n      AND t.unit_factor = 1\n    QUALIFY\n      LAST_VALUE(LOWER(product_status))\n        OVER (\n          PARTITION BY article_no\n          ORDER BY dt\n          ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING\n        )\n      = 'clear'\n  ),\n  with_lag AS (\n    SELECT\n      article_no,\n      dt,\n      status,\n      retail_price_inc_vat,\n      CASE\n        WHEN lag(dt) OVER (PARTITION BY article_no ORDER BY dt) = dt - 1 THEN 0\n        ELSE 1\n      END AS break_flag\n    FROM hist\n  ),\n  grp AS (\n    SELECT\n      article_no,\n      dt,\n      status,\n      retail_price_inc_vat,\n      sum(break_flag) OVER (\n        PARTITION BY article_no\n        ORDER BY dt\n        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n      ) AS grp_id\n    FROM with_lag\n  ),\n  last_grp AS (\n    SELECT\n      article_no,\n      grp_id\n    FROM grp\n    QUALIFY grp_id = max(grp_id) OVER (PARTITION BY article_no)\n  ),\n  final AS (\n    SELECT\n      g.article_no,\n      min(g.dt) AS status_start_date,\n      max(g.dt) AS status_last_date,\n      date_diff(max(g.dt), min(g.dt), day) + 1 AS consecutive_days,\n      min(g.retail_price_inc_vat) AS retail_price_inc_vat\n    FROM grp g\n    JOIN last_grp l\n      ON g.article_no = l.article_no\n      AND g.grp_id = l.grp_id\n    WHERE g.article_no IN (\n        '20001634','20061895','20052828','20002375')\n    GROUP BY g.article_no\n  ),\n  dim AS (\n    SELECT DISTINCT\n      article_no, product_name, product_status\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n    WHERE dt = current_date() - 1\n  ),\n  promo AS (\n    SELECT\n      article_no,\n      date(promotion_effective_date_bkk) AS eff_date,\n      promotion_effective_date_bkk,\n      promotion_expire_date_bkk AS exp_date,\n      total_current_promotion_price_amount AS pro_price,\n      theme_name\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_promotion`\n    WHERE\n      dt = current_date() - 1\n      AND source_system = 'CJX_NEST'\n      AND is_cancelled = FALSE\n      AND (\n        lower(theme_name) LIKE '%clear%'\n        OR lower(theme_name) LIKE '%เคลียร์%'\n      )\n      AND promotion_expire_date_bkk >= current_date()\n      AND selected_store = 'ALL_STORE'\n    QUALIFY\n      row_number() OVER (\n        PARTITION BY article_no\n        ORDER BY date(promotion_effective_date_bkk) DESC\n      ) = 1\n  ),\n  ros AS (\n    SELECT\n      article_no,\n      as_of_date,\n      avg(cjx_ros_avg_sale_ex_event_period) AS ros\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_ros_average_sales`\n    WHERE as_of_date BETWEEN date_trunc(date_sub(current_date(), interval 3 month), month)\n      AND current_date() - 1\n    GROUP BY 1, 2\n  ),\n  stock AS (\n    SELECT\n      movement_d,\n      article_no,\n      sum(available_qty) AS available_qty\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_store_stock`\n    WHERE movement_d BETWEEN date_trunc(date_sub(current_date(), interval 3 month), month)\n      AND current_date() - 1\n      AND available_qty > 0\n      AND store_code LIKE 'CJX0%'\n    GROUP BY 1, 2\n  )\nSELECT\n  f.article_no,\n  d.product_name,\n  d.product_status,\n  f.status_start_date,\n  f.status_last_date,\n  f.consecutive_days,\n  f.retail_price_inc_vat,\n  p.promotion_effective_date_bkk AS eff_date,\n  p.exp_date,\n  p.pro_price,\n  p.theme_name,\n  r.ros,\n  s.available_qty\nFROM final f\nLEFT JOIN dim d ON d.article_no = f.article_no\nLEFT JOIN promo p ON p.article_no = f.article_no\nLEFT JOIN ros r ON r.article_no = f.article_no AND r.as_of_date = p.eff_date\nLEFT JOIN stock s ON s.article_no = f.article_no AND s.movement_d = p.eff_date - 1\nORDER BY f.article_no"}, {"id": "1776406679481", "name": "CJX Clear Pro with ROS and QTY at Start Date", "type": "BigQuery", "desc": "cjx clear pro with ros and stock qty at the beginning of pro start date", "code": "WITH\n  dim AS (\n    SELECT DISTINCT\n      article_no, product_name, product_status\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n    WHERE dt = current_date() - 1\n  ),\n  promo AS (\n    SELECT DISTINCT\n      article_no,\n      date(promotion_effective_date_bkk) AS eff_date,\n      promotion_effective_date_bkk,\n      promotion_expire_date_bkk AS exp_date,\n      total_current_promotion_price_amount AS pro_price,\n      theme_name\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_promotion`\n    WHERE\n      dt = current_date() - 1\n      AND source_system = 'CJX_NEST'\n      AND is_cancelled = FALSE\n      AND (\n        lower(theme_name) LIKE '%clear%'\n        OR lower(theme_name) LIKE '%เคลียร์%'\n      )\n      AND promotion_expire_date_bkk >= current_date()\n      AND selected_store = 'ALL_STORE'\n  ),\n  ros AS (\n    SELECT\n      article_no,\n      as_of_date,\n      avg(cjx_ros_avg_sale_ex_event_period) AS ros\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_ros_average_sales`\n    WHERE as_of_date BETWEEN date_trunc(date_sub(current_date(), interval 3 month), month)\n      AND current_date() - 1\n    group by 1,2\n  ),\n  stock AS (\n    SELECT\n      movement_d,\n      article_no,\n      sum(available_qty) AS available_qty\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_store_stock`\n    WHERE movement_d BETWEEN date_trunc(date_sub(current_date(), interval 3 month), month)\n      AND current_date() - 1\n      AND available_qty > 0\n      AND store_code LIKE 'CJX0%'\n      AND article_no LIKE '2%'\n    GROUP BY 1, 2\n  )\nSELECT\n  p.article_no,\n  d.product_name,\n  d.product_status,\n  p.promotion_effective_date_bkk AS eff_date,\n  p.exp_date,\n  p.pro_price,\n  p.theme_name,\n  r.ros,\n  s.available_qty\nFROM promo p\nLEFT JOIN dim d ON d.article_no = p.article_no\nLEFT JOIN ros r ON r.article_no = p.article_no AND r.as_of_date = p.eff_date\nLEFT JOIN stock s ON s.article_no = p.article_no AND s.movement_d = p.eff_date-1\nORDER BY p.article_no, p.pro_price DESC"}, {"id": "1776406607121", "name": "CJX Clear Start and End Date with RSP", "type": "BigQuery", "desc": "return start and end date of latest clear status with rsp at the start of clear date", "code": "WITH\n  hist AS (\n    SELECT\n      t.article_no,\n      t.dt,\n      lower(t.product_status) AS status,\n      t.retail_price_inc_vat,\n      t.unit_factor\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product` t\n    WHERE t.dt <= current_date() - 1\n      AND lower(t.product_status) = 'clear'\n      AND t.unit_factor = 1\n    QUALIFY\n      LAST_VALUE(LOWER(product_status))\n        OVER (\n          PARTITION BY article_no\n          ORDER BY dt\n          ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING\n        )\n      = 'clear'\n  ),\n  with_lag AS (\n    SELECT\n      article_no,\n      dt,\n      status,\n      retail_price_inc_vat,\n      CASE\n        WHEN lag(dt) OVER (PARTITION BY article_no ORDER BY dt) = dt - 1 THEN 0\n        ELSE 1\n      END AS break_flag\n    FROM hist\n  ),\n  grp AS (\n    SELECT\n      article_no,\n      dt,\n      status,\n      retail_price_inc_vat,\n      sum(break_flag) OVER (\n        PARTITION BY article_no\n        ORDER BY dt\n        ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n      ) AS grp_id\n    FROM with_lag\n  ),\n  last_grp AS (\n    SELECT\n      article_no,\n      grp_id\n    FROM grp\n    QUALIFY grp_id = max(grp_id) OVER (PARTITION BY article_no)\n  ),\n  final AS (\n    SELECT\n      g.article_no,\n      min(g.dt) AS status_start_date,\n      max(g.dt) AS status_last_date,\n      date_diff(max(g.dt), min(g.dt), day) + 1 AS consecutive_days,\n      -- retail_price ณ วันแรกที่เป็น clear\n      min(g.retail_price_inc_vat) AS retail_price_inc_vat\n    FROM grp g\n    JOIN last_grp l\n      ON g.article_no = l.article_no\n      AND g.grp_id = l.grp_id\n    WHERE g.article_no IN (\n        '20001634','20061895','20052828','20002375')\n    GROUP BY g.article_no\n  )\nSELECT\n  f.article_no,\n  f.status_start_date,\n  f.status_last_date,\n  f.consecutive_days,\n  f.retail_price_inc_vat\nFROM final f\nORDER BY f.article_no"}, {"id": "1776318885853", "name": "CJX Sales by RC", "type": "BigQuery", "desc": "cjx sales by receipt no, raw data by date by store by barcode", "code": "with dim as(\n  select distinct\n    barcode\n    ,product_name\n    ,family\n    ,class\n    ,sub_class\n    ,unit\n    ,unit_factor\n    ,vat\n  from `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n  where dt = current_date()-1\n    and barcode_status = 'ACTIVE'\n)\n\nSELECT\n  receipt_date\n  ,receipt_time_bkk\n  ,receipt_no\n  ,store_code\n  ,store_name\n  ,article_no\n  ,d.product_name\n  ,s.barcode\n  ,d.family\n  ,d.class\n  ,d.sub_class\n  ,d.unit\n  ,d.unit_factor\n  ,d.vat\n  ,after_refund_sale_qty\n  ,after_refund_total_sale_qty\n  ,after_refund_total_sale_amount\n  ,after_refund_total_discount_amount\n  ,after_refund_coupon_discount_amount\n  ,after_refund_net_sale_amount_inc_vat\n  ,after_refund_net_sale_amount_exc_vat\n  ,sale_type\n  ,case when member_id is not null then \"สมาชิก\" else 'ลูกค้าทั่วไป' end as customer_type\n  ,member_id\nFROM `cjx-data-core.cjx_data_mart_prod.mart_console_sales` as s\nleft join dim d on d.barcode = s.barcode\nWHERE receipt_date BETWEEN '2026-04-09' AND current_date()-1\n  and store_code in ('CJX00068','CJX00069','CJX00070','CJX00075','CJX00074','CJX00080','CJX00088','CJX00076','CJX00078','CJX00077','CJX00072','CJX00086','CJX00083','CJX00091','CJX00071','CJX00085','CJX00081','CJX00082','CJX00084','CJX00094','CJX00092','CJX00093','CJX00104','CJX00089','CJX00087','CJX00107','CJX00103','CJX00100','CJX00099','CJX00090','CJX00098','CJX00110','CJX00095','CJX00108','CJX00109','CJX00118')\n  and d.class in ('CHILLED FOOD','CHILLED BEVERAGE&CHEESE',\"BAKERY (DC)\",'LIQUID FRESH MILK','CUP YOGURT')\n  and d.sub_class in ('SAUSAGE & HAM','PROCESSING FOOD','PROCESSING EGG','CHEESE&BUTTER','CHILLED PROJECT','DESSERT','CH DESSERT DCC','CH CAKE DCC','CH BREAD BUN DCC','CH PASTRY DCC','HERBAL DRINK','CH SANDWICH DCC','CH BREAD&SPREAD DCC','CH SNACK BAKERY DCC','PASTEURIZED YOG.','CULTURED YOG.','PASTEURIZE MILK','LOW FAT','PLAIN','CEREAL','FLAVOURED')\n  and after_refund_sale_qty > 0"}, {"id": "1775804282596", "name": "Convert to Table", "type": "VBA", "desc": "convert sheet range to table, loop through every sheets", "code": "Sub convert_to_table()\n'\n' convert_to_table Macro\n'convert sheet range to table, loop through every sheets\n\n'\nDim i As Integer\nDim ws As Worksheet\nDim sh As Integer\n\nsh = ActiveWorkbook.Sheets.Count\nFor Each ws In ActiveWorkbook.Worksheets\n    Application.CutCopyMode = False\n    ws.Activate\n    ActiveSheet.AutoFilterMode = False\n    If ws.ListObjects.Count = 0 Then\n    ActiveSheet.ListObjects.Add(xlSrcRange, Range(\"A1\", Range(\"A1\").End(xlToRight).End(xlDown)), , xlYes).Name _\n    = \"table_\" & ActiveSheet.Name\n    Else\n        ws.ListObjects(1).Name = \"table_\" & ActiveSheet.Name\n    End If\n    Range(\"c1\").value = \"article_no\"\n    Range(\"c2\").value = ActiveSheet.Name\n    Range(\"c2\").Select\n    Selection.AutoFill Destination:=Range(\"c2:c\" & Range(\"A\" & Rows.Count).End(xlUp).Row), Type:=xlFillCopy\nNext ws\nMsgBox \"Total Sheets of \" & sh\nEnd Sub"}, {"id": "1775804260591", "name": "CJX Stock by Article by Store", "type": "BigQuery", "desc": "stock by article by store", "code": "SELECT \n  store_code\n  ,article_no\n  ,sum(available_qty) as available_qty\nFROM `cjx-data-core.cjx_data_mart_prod.mart_console_store_stock`\nWHERE movement_d = current_date()-1\n  and available_qty > 0\n  and store_code like 'CJX0%'\n  and article_no like '2%'\ngroup by 1,2"}, {"id": "1775804242344", "name": "CJX PO RO Tracking", "type": "BigQuery", "desc": "return PO RO number of DTS products with order qty and amount and receive qty and amount", "code": "with po as(\n  select distinct\n    purchase_order_no as po_no\n    ,date(created_at) as po_date\n  from `cjx-data-core.cjx_data_mart_prod.mart_console_good_receive`\n  where gr_d between GREATEST(parse_date('%Y%m%d',@DS_START_DATE), parse_date('%Y%m%d',@DS_END_DATE)-31)\n    and parse_date('%Y%m%d',@DS_END_DATE)\n)\nselect\n  order_no\n  ,gr_no\n  ,date(gr_date) as gr_date\n  ,purchase_order_no as po_no\n  ,p.po_date\n  ,store_code\n  ,store_name\n  ,gr_type\n  ,order_type\n  ,supplier_code\n  ,supplier_name\n  ,item_no\n  ,article_no\n  ,barcode\n  ,product_name\n  ,unit\n  ,unit_factor\n  ,qty\n  ,retail_price_inc_vat_per_unit_amount as rsp\n  ,(qty*retail_price_inc_vat_per_unit_amount) as total_order_amount\n  ,receive_qty\n  ,receive_amount\n  ,(unit_factor*receive_amount) as total_recei
