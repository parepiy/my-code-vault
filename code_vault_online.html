ve_amount\n  ,claim_qty\n  ,claim_amount\n  ,total_claim_amount\n  ,remain_qty\n  ,remain_amount\nfrom `cjx-data-core.cjx_data_mart_prod.mart_console_receive_order` as r\nleft join po p on p.po_no = r.purchase_order_no\nwhere r.gr_d between GREATEST(parse_date('%Y%m%d',@DS_START_DATE), parse_date('%Y%m%d',@DS_END_DATE)-31)\n  and parse_date('%Y%m%d',@DS_END_DATE)\n  and gr_type != 'WAREHOUSE'\n  and article_no like '2%'"}, {"id": "1775804225574", "name": "CJ Maxcost", "type": "BigQuery", "desc": "cj maxcost", "code": "with cjx_div as(\n  SELECT\n    bu_prefix, cjx_division\n  FROM `tdshop-data-business-units-com.commercial_sandbox.cjx_division`\n),\ncj_max as(\n  SELECT\n    split(cj_division,\"-\")[offset(0)] as cj_div_prefix\n    ,*\n  FROM `tdshop-data-business-units-com.commercial_sandbox.cj_max_cost`\n),\ncjx_dim as(\n  select distinct\n    article_no\n    ,product_status as cjx_status\n    ,barcode\n    ,case when vat = true then 1.07 else 1 end as cjx_vat\n    ,unit\n    ,unit_factor\n    ,retail_price_inc_vat as rsp\n    ,case when picking_unit_barcode = barcode then \"Yes\" end as picking\n  from `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n  where dt = current_date()-1\n)"}, {"id": "1775804210687", "name": "TD Family Class Change Tracking", "type": "BigQuery", "desc": "td family class change tracking specific on preorder to grocery or grocery to preorder", "code": "with dim as(\n  select distinct\n    article_no\n    ,product_name\n    ,family\n    ,class\n    ,sub_class\n  from `tdshop-prod.dimension.product`\n  where created_d = current_date()-1\n)\n\nselect distinct\n  nn.article_no\n  ,dim.product_name\n  ,lag(nn.family,1) over(partition by nn.article_no order by nn.created_d) as family_from\n  ,nn.family as family_to\n  ,dim.family as current_family\n  ,dim.class as current_class\n  ,dim.sub_class as current_subclass\n  ,nn.created_d\nfrom `tdshop-prod.dimension.product` as nn\nleft join dim on nn.article_no = dim.article_no\nwhere nn.created_d between '2026-01-03' and current_date()-1\n  and nn.article_no like '2%'\nqualify\n  family_from != family_to\n  and (\n    lower(family_from) in ('pre order','pre order-f')\n    or lower(family_to)   in ('pre order','pre order-f')\n  )"}, {"id": "1775804194187", "name": "CJX All Promotion (Clear First Priority)", "type": "BigQuery", "desc": "cjx all promotion, no filter eff date end date, put clear pro as first priority", "code": "WITH\n  promo AS (\n    SELECT\n      article_no,\n      total_current_promotion_price_amount AS pro_price,\n      promotion_effective_date_bkk AS eff_date,\n      promotion_expire_date_bkk AS exp_date,\n      theme_name,\n      CASE\n        WHEN\n          LOWER(theme_name) LIKE '%clear%'\n          OR theme_name LIKE '%เคลียร์%'\n          THEN 1\n        ELSE 2\n        END AS priority\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_promotion`\n    WHERE\n      dt = current_date() - 1\n      AND is_cancelled = FALSE\n      AND article_no IN (\n        '20001634', '20046677')\n      AND source_system = 'CJX_NEST'\n      AND selected_store = 'ALL_STORE'\n  ),\n  ranked AS (\n    SELECT\n      *,\n      ROW_NUMBER()\n        OVER (\n          PARTITION BY article_no\n          ORDER BY priority ASC, exp_date DESC\n        ) AS rn\n    FROM promo\n  )\nSELECT\n  article_no,\n  pro_price,\n  eff_date,\n  exp_date,\n  theme_name\nFROM ranked\nWHERE rn = 1"}, {"id": "1775804178197", "name": "CJX Clear Date", "type": "BigQuery", "desc": "return latest date each article status is clear and clear pro", "code": "WITH\n  hist AS (\n    SELECT\n      t.article_no,\n      t.dt,\n      lower(t.product_status) AS status,\n      CASE\n        WHEN lower(t.product_status) NOT IN ('clear', 'clear_promotion') THEN 1\n        WHEN\n          lag(lower(t.product_status))\n            OVER (\n              PARTITION BY t.article_no\n              ORDER BY t.dt\n            )\n          != lower(t.product_status)\n          THEN 1\n        ELSE 0\n        END AS break_flag\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product` t\n    WHERE t.dt <= current_date() - 1\n    QUALIFY\n      -- เอาเฉพาะ product ที่ล่าสุดเป็น clear / clear_promotion\n      LAST_VALUE(LOWER(product_status))\n        OVER (\n          PARTITION BY article_no\n          ORDER BY dt\n          ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING\n        )\n      IN ('clear', 'clear_promotion')\n  ),\n  grp AS (\n    SELECT\n      article_no,\n      dt,\n      status,\n      sum(break_flag)\n        OVER (\n          PARTITION BY article_no\n          ORDER BY dt\n          ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n        ) AS grp_id\n    FROM hist\n  ),\n  last_grp AS (\n    SELECT\n      article_no, status, max(grp_id) AS last_grp_id\n    FROM grp\n    WHERE lower(status) IN ('clear', 'clear_promotion')\n    GROUP BY 1, 2\n  )\nSELECT\n  g.article_no,\n  g.status,\n  min(g.dt) AS status_start_date,\n  date_diff(max(g.dt), min(g.dt), day) + 1 AS consecutive_days\nFROM grp g\nJOIN last_grp l\n  ON\n    g.article_no = l.article_no\n    AND g.status = l.status\n    AND g.grp_id = l.last_grp_id\nWHERE\n  g.article_no IN (\n    '20037105', '20007985')\nGROUP BY g.article_no, g.status\nORDER BY g.article_no, g.status"}, {"id": "1775804161217", "name": "CJX Last Clear Promotion", "type": "BigQuery", "desc": "cjx last clear promotion of each article, no filter eff date end date", "code": "WITH\n  promo AS (\n    SELECT\n      article_no,\n      total_current_promotion_price_amount AS pro_price,\n      promotion_effective_date_bkk AS eff_date,\n      promotion_expire_date_bkk AS exp_date,\n      theme_name\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_promotion`\n    WHERE\n      dt = current_date() - 1\n      AND is_cancelled = FALSE\n      AND article_no IN (\n        '20047170', '20059962')\n      AND source_system = 'CJX_NEST'\n      AND selected_store = 'ALL_STORE'\n      AND (\n        LOWER(theme_name) LIKE '%clear%'\n        OR theme_name LIKE '%เคลียร์%')\n  ),\n  ranked AS (\n    SELECT\n      *,\n      ROW_NUMBER()\n        OVER (\n          PARTITION BY article_no\n          ORDER BY exp_date DESC\n        ) AS rn\n    FROM promo\n  )\nSELECT\n  article_no,\n  pro_price,\n  eff_date,\n  exp_date,\n  theme_name\nFROM ranked\nWHERE rn = 1"}, {"id": "1775804143059", "name": "CJX Clear Promotion", "type": "BigQuery", "desc": "cjx clear pro, filter only active and awaiting pro only", "code": "WITH\n  dim AS (\n    SELECT DISTINCT\n      article_no, product_name, product_status\n    FROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n    WHERE dt = current_date() - 1\n  )\nSELECT DISTINCT\n  p.article_no,\n  d.product_name,\n  d.product_status,\n  p.promotion_effective_date_bkk AS eff_date,\n  p.promotion_expire_date_bkk AS exp_date,\n  p.total_current_promotion_price_amount AS pro_price,\n  p.theme_name\nFROM `cjx-data-core.cjx_data_mart_prod.mart_console_dim_promotion` AS p\nLEFT JOIN dim d\n  ON d.article_no = p.article_no\nWHERE\n  dt = current_date() - 1\n  AND source_system = 'CJX_NEST'\n  AND is_cancelled = FALSE\n  AND (\n    lower(theme_name) LIKE '%clear%'\n    OR lower(theme_name) LIKE '%เคลียร์%')\n  AND promotion_expire_date_bkk >= current_date()\n  AND selected_store = 'ALL_STORE'\nORDER BY 1, 6 DESC"}, {"id": "1775804122255", "name": "CJX Stock, Store with Stock, POG store by Article", "type": "BigQuery", "desc": "CJX Stock, Store with Stock, POG store by Article", "code": "with stock as(\n  SELECT\n    article_no,\n    sum(available_qty) AS available_qty,\n    COUNT(DISTINCT store_code) AS store_with_stock\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_console_store_stock`\n  WHERE\n    movement_d = current_date() - 1\n    AND store_code LIKE 'CJX0%'\n    AND available_qty > 0\n    and article_no in ('20052866','20006885')\n  GROUP BY 1\n),\npog as(\n  SELECT\n    article_no, COUNT(DISTINCT store_code) AS pog_store\n  FROM `cjx-data-core.cjx_data_mart_prod.mart_store_assortment_store`\n  WHERE\n    as_of_date = current_date() - 1\n    AND assortment_type = 'MASTER'\n    and article_no in ('20052866','20006885')\n  GROUP BY 1\n)\nselect distinct\n  d.article_no\n  ,p.pog_store\n  ,s.available_qty\n  ,s.store_with_stock\nfrom `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product` as d\nleft join pog p on p.article_no = d.article_no\nleft join stock s on s.article_no = d.article_no\nwhere dt = current_date()-1\n  and d.article_no in ('20052866','20006885')"}, {"id": "1775804098983", "name": "CJX Product Dimension", "type": "BigQuery", "desc": "cjx product assortment (no moving)", "code": "select\n  *\nfrom `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\nwhere dt = current_date()-1\n  and article_no in ('20052866','20006885')"}, {"id": "1775804053721", "name": "CJX Clear to Clear Promotion", "type": "BigQuery", "desc": "return items that need to change status from clear to clear pro", "code": "with dim as(\n  select distinct\n    article_no\n    ,product_name\n    ,product_status\n  from `cjx-data-core.cjx_data_mart_prod.mart_console_dim_product`\n  where dt = current_date()-1\n)\nselect distinct\n  p.article_no\n  ,d.product_name\n  ,d.product_status\n  ,p.theme_name\n  ,p.promotion_effective_date_bkk as eff_date\n  ,p.promotion_expire_date_bkk as exp_date\nfrom `cjx-data-core.cjx_data_mart_prod.mart_console_dim_promotion` as p\nleft join dim d on d.article_no = p.article_no\nwhere dt = current_date()-1\n  and source_system = 'CJX_NEST'\n  and is_cancelled = false\n  and (lower(theme_name) like '%clear%' or lower(theme_name) like '%เคลียร์%')\n  and promotion_effective_date_bkk <= current_date()\n  and promotion_expire_date_bkk >= current_date()\n  and lower(d.product_status) = 'clear'\norder by 1,5\n--limit 100"}, {"id": "1775804030726", "name": "Highlight Excel Data Row", "type": "VBA", "desc": "Highlights the entire data row of the active cell (from first to last column based on row 1 headers) with a fixed color (RGB 14614168 = light blue-gray). After highlighting, moves the cursor down one row. Keyboard shortcut: Ctrl+D.", "code": "Sub highlight()\n' Highlight entire row from first to last column\n' Keyboard Shortcut: Ctrl+D\nDim headerFirstCol As Long\nDim headerLastCol As Long\nDim rowNum As Long\n' Find first non-empty column in row 1\nIf IsEmpty(Cells(1, 1)) Then\nMsgBox \"No header found in row 1\", vbExclamation\nExit Sub\nEnd If\nheaderFirstCol = 1\nheaderLastCol = Cells(1, Columns.Count).End(xlToLeft).Column\nrowNum = ActiveCell.Row\nRange(Cells(rowNum, headerFirstCol), Cells(rowNum, headerLastCol)) _\n.Interior.Color = 14614168\nCells(rowNum + 1, ActiveCell.Column).Select\nEnd Sub"}, {"id": "1775804010731", "name": "Insert Picture in Excel Cell", "type": "VBA", "desc": "Opens a file picker dialog (PNG/JPG only), lets the user select an image, then inserts it as a comment (note) on the active cell. The image is fixed at 150pt width with aspect ratio locked. Keyboard shortcut: Ctrl+Shift+I.", "code": "Sub insert_pic()\n' Insert image as cell comment (Ctrl+Shift+I)\nConst FIXED_WIDTH As Single = 150 ' picture width in points\nDim PicturePath As String\nDim CommentBox As Comment\nDim tgt As Range\nSet tgt = ActiveCell\nWith Application.FileDialog(msoFileDialogFilePicker)\n.AllowMultiSelect = False\n.Title = \"Select Comment Image\"\n.ButtonName = \"Insert Image\"\n.Filters.Clear\n.Filters.Add \"Images\", \"*.png; *.jpg\"\nIf .Show <> -1 Then Exit Sub\nPicturePath = .SelectedItems(1)\nEnd With\ntgt.ClearComments\nSet CommentBox = tgt.AddComment(\"\")\nWith CommentBox.Shape\n.Fill.UserPicture PicturePath\n.LockAspectRatio = msoTrue\n.Width = FIXED_WIDTH\nEnd With\nCommentBox.Visible = False\nEnd Sub"}, {"id": "1775803992169", "name": "Download and Save Picture from URL", "type": "VBA", "desc": "Downloads images from URLs listed in column B (with filenames in column A) of the active sheet. Saves them to a local Pictures folder. Retries each download up to 3 times on failure. Logs all failures (row, URL, reason) to a 'Download_Log' sheet. Shows a completion summary with success/fail counts. Helper functions: DownloadImage (HTTP GET with retry), GetFileExtension (parses URL extension), CleanFileName (strips illegal chars), PrepareLogSheet (creates/resets log sheet), LogFail (writes error row).", "code": "Sub DownloadAndSaveImages()\nConst SAVE_PATH As String = \"C:\\Users\\piyathida.pi\\Downloads\\Pictures\\\"\nDim ws As Worksheet\nDim logWs As Worksheet\nDim i As Long, lastRow As Long\nDim imgURL As String, imgName As String\nDim ext As String\nDim successCnt As Long, failCnt As Long\nIf ActiveWorkbook.Path = \"\" Then\nMsgBox \"Please save the workbook first.\", vbCritical\nExit Sub\nEnd If\nApplication.ScreenUpdating = False\nApplication.StatusBar = \"Preparing download...\"\nSet ws = ActiveSheet\nlastRow = ws.Cells(ws.Rows.Count, \"A\").End(xlUp).Row\nIf Dir(SAVE_PATH, vbDirectory) = \"\" Then MkDir SAVE_PATH\nSet logWs = PrepareLogSheet\nFor i = 2 To lastRow\nimgName = Trim(ws.Cells(i, \"A\").Value)\nimgURL = Trim(ws.Cells(i, \"B\").Value)\nApplication.StatusBar = \"Downloading \" & i - 1 & \" / \" & lastRow - 1\nIf imgName = \"\" Or imgURL = \"\" Then\nLogFail logWs, i, imgURL, \"Missing name or URL\"\nfailCnt = failCnt + 1\nGoTo nextRow\nEnd If\next = GetFileExtension(imgURL)\nIf ext = \"\" Then ext = \"jpg\"\nIf Not DownloadImage(imgURL, SAVE_PATH & CleanFileName(imgName) & \".\" & ext) Then\nLogFail logWs, i, imgURL, \"Download Failed\"\nfailCnt = failCnt + 1\nElse\nsuccessCnt = successCnt + 1\nEnd If\nnextRow:\nDoEvents\nNext i\nApplication.StatusBar = False\nApplication.ScreenUpdating = True\nMsgBox \"Completed!\" & vbCrLf & _\n\"Success: \" & successCnt & vbCrLf & _\n\"Failed: \" & failCnt, vbInformation\nEnd Sub\n' --- Helper: Download with retry ---\nFunction DownloadImage(Url As String, fullPath As String) As Boolean\nDim http As Object\nDim byteData() As Byte\nDim fileNum As Integer\nDim attempt As Integer\nFor attempt = 1 To 3\nOn Error GoTo Retry\nSet http = CreateObject(\"MSXML2.ServerXMLHTTP\")\nhttp.Open \"GET\", Url, False\nhttp.setTimeouts 5000, 5000, 5000, 5000\nhttp.Send\nIf http.Status = 200 Then\nbyteData = http.responseBody\nfileNum = FreeFile\nOpen fullPath For Binary As #fileNum\nPut #fileNum, , byteData\nClose #fileNum\nDownloadImage = True\nExit Function\nEnd If\nRetry:\nSet http = Nothing\nOn Error GoTo 0\nDoEvents\nNext attempt\nDownloadImage = False\nEnd Function\n' --- Helper: Extract extension from URL ---\nFunction GetFileExtension(Url As String) As String\nDim tmp As String\ntmp = Split(Url, \"?\")(0)\nIf InStr(tmp, \".\") > 0 Then\nGetFileExtension = LCase(Mid(tmp, InStrRev(tmp, \".\") + 1))\nEnd If\nEnd Function\n' --- Helper: Remove illegal filename characters ---\nFunction CleanFileName(fname As String) As String\nfname = Replace(fname, \"/\", \"_\")\nfname = Replace(fname, \"\\\", \"_\")\nfname = Replace(fname, \":\", \"_\")\nfname = Replace(fname, \"*\", \"_\")\nfname = Replace(fname, \"?\", \"_\")\nfname = Replace(fname, \"\"\"\", \"_\")\nfname = Replace(fname, \"<\", \"_\")\nfname = Replace(fname, \">\", \"_\")\nfname = Replace(fname, \"|\", \"_\")\nCleanFileName = fname\nEnd Function\n' --- Helper: Prepare/reset Download_Log sheet ---\nFunction PrepareLogSheet() As Worksheet\nDim ws As Worksheet\nOn Error Resume Next\nSet ws = ActiveWorkbook.Worksheets(\"Download_Log\")\nOn Error GoTo 0\nIf ws Is Nothing Then\nSet ws = ActiveWorkbook.Worksheets.Add\nws.Name = \"Download_Log\"\nElse\nws.Cells.Clear\nEnd If\nws.Range(\"A1:C1\").Value = Array(\"Row\", \"URL\", \"Reason\")\nSet PrepareLogSheet = ws\nEnd Function\n' --- Helper: Log a failed download ---\nSub LogFail(ws As Worksheet, rowNum As Long, Url As String, reason As String)\nDim r As Long\nr = ws.Cells(ws.Rows.Count, \"A\").End(xlUp).Row + 1\nws.Cells(r, 1).Value = rowNum\nws.Cells(r, 2).Value = Url\nws.Cells(r, 3).Value = reason\nEnd Sub"}, {"id": "1775803966954", "name": "Hide Active Sheet", "type": "VBA", "desc": "Hides the active sheet. Asks user: Very Hidden (not visible in UI) or just Hidden", "code": "Sub hide_sheet()\nDim ws As Worksheet\nDim mode As XlSheetVisibility\nSet ws = ActiveSheet\nIf MsgBox(\"Hide sheet as Very Hidden?\" & vbCrLf & _\n\"Yes = Very Hidden\" & vbCrLf & _\n\"No = Hidden\", _\nvbQuestion + vbYesNo) = vbYes Then\nmode = xlVeryHidden\nElse\nmode = xlHidden\nEnd If\nws.Visible = mode\nEnd Sub"}, {"id": "1775803948887", "name": "Unhide Selected Sheets", "type": "VBA", "desc": "Lists all hidden/very-hidden sheets with numbers, then lets user type comma-separated numbers to unhide specific ones", "code": "Sub UnhideSelectedSheets()\nDim ws As Worksheet\nDim hiddenSheets As Collection\nDim sheetList As String\nDim i As Long, idx As Long\nDim userInput As String\nDim selections() As String\nDim invalidItems As String\nSet hiddenSheets = New Collection\nsheetList = \"Hidden Sheets List:\" & vbCrLf\nFor Each ws In ActiveWorkbook.Worksheets\nIf ws.Visible <> xlSheetVisible Then\nhiddenSheets.Add ws\nsheetList = sheetList & hiddenSheets.Count & \". \" & ws.Name & vbCrLf\nEnd If\nNext ws\nIf hiddenSheets.Count = 0 Then\nMsgBox \"No hidden sheets found.\", vbInformation\nExit Sub\nEnd If\nMsgBox sheetList, vbInformation, \"Hidden Sheets\"\nuserInput = InputBox(\"Input sheet numbers to unhide (ex: 1,3):\", \"Unhide Sheets\")\nIf Trim(userInput) = \"\" Then Exit Sub\nselections = Split(userInput, \",\")\nFor i = LBound(selections) To UBound(selections)\nIf IsNumeric(Trim(selections(i))) Then\nidx = CLng(Trim(selections(i)))\nIf idx >= 1 And idx <= hiddenSheets.Count Then\nhiddenSheets(idx).Visible = xlSheetVisible\nElse\ninvalidItems = invalidItems & selections(i) & \", \"\nEnd If\nElse\ninvalidItems = invalidItems & selections(i) & \", \"\nEnd If\nNext i\nIf invalidItems <> \"\" Then\nMsgBox \"Some inputs were invalid: \" & Left(invalidItems, Len(invalidItems) - 2), vbExclamation\nElse\nMsgBox \"Selected sheets are unhidden.\", vbInformation\nEnd If\nEnd Sub"}, {"id": "1775803930220", "name": "Unhide All Sheets", "type": "VBA", "desc": "Unhides all sheets in the workbook at once", "code": "Sub UnhideAllWorksheet()\nDim ws As Worksheet\nFor Each ws In ActiveWorkbook.Worksheets\nOn Error Resume Next\nws.Visible = xlSheetVisible\nOn Error GoTo 0\nNext ws\nEnd Sub"}, {"id": "1775803907585", "name": "Breaklink", "type": "VBA", "desc": "Breaks all external Excel links in the active workbook. Loops until no more links remain — handles cases where breaking one link creates or reveals another. Safe to call even if there are no links.", "code": "Sub breaklink()\nDim aLinksArray As Variant\naLinksArray = ActiveWorkbook.LinkSources(Type:=xlLinkTypeExcelLinks)\nDo Until IsEmpty(aLinksArray)\nActiveWorkbook.BreakLink Name:=aLinksArray(1), Type:=xlLinkTypeExcelLinks\naLinksArray = ActiveWorkbook.LinkSources(Type:=xlLinkTypeExcelLinks)\nLoop\nEnd Sub"}, {"id": "1775803891963", "name": "Backup File", "type": "VBA", "desc": "Creates a timestamped backup copy of the active workbook. Asks if the OS is macOS: if Yes, saves to a hardcoded OneDrive Mac path. If No, opens a folder picker and saves to the chosen folder. Filename format: (dd-mm-yyyy hh.mm) OriginalName.ext.", "code": "Sub backupfile()\nConst MAC_PATH As String = _\n\"/Users/parepiy/Library/CloudStorage/OneDrive-TDTawandang/Mac File Backup/\"\nDim nResult As VbMsgBoxResult\nDim sDateTime As String\nDim folder As String\nnResult = MsgBox(\"Is your operating system macOS?\", vbYesNo)\nsDateTime = \"(\" & Format(Now, \"dd-mm-yyyy hh.mm\") & \")\"\nSelect Case nResult\nCase vbYes\nWith ActiveWorkbook\n.SaveCopyAs fileName:=MAC_PATH & sDateTime & \" \" & .Name\nEnd With\nCase vbNo\nWith Application.FileDialog(4)\n.AllowMultiSelect = False\nIf .Show <> -1 Then Exit Sub\nfolder = .SelectedItems(1)\nEnd With\nWith ActiveWorkbook\n.SaveCopyAs fileName:=folder & \"\\\" & sDateTime & \" \" & .Name\nEnd With\nEnd Select\nEnd Sub"}, {"id": "1775803863591", "name": "Save New File", "type": "VBA", "desc": "Saves the active workbook as a clean, values-only .xlsx file to a Request folder. Steps: (1) Deletes all Power Query connections, (2) Loops sheets in reverse — deletes 'Admin' sheet, pastes values-only for others, (3) Prompts for a filename, saves as 'filename_YYYYMMDD.xlsx', (4) Opens Windows Explorer highlighting the saved file.", "code": "Sub save_new_file()\nDim wb As Workbook\nDim ws As Worksheet\nDim pq As Object\nDim fileName As String, fileCode As String\nDim savePath As String\nDim i As Long\nSet wb = ActiveWorkbook\nsavePath = \"D:\\OneDrive\\OneDrive - cjmart\\Pare\\Raw Data\\Request\\\"\nApplication.DisplayAlerts = False\nApplication.ScreenUpdating = False\nApplication.EnableEvents = False\nOn Error GoTo CleanUp\nfileName = Trim(InputBox(\"Input File Name\", \"File Name\"))\nIf fileName = \"\" Then GoTo CleanUp\nfileCode = Format(Date, \"yyyymmdd\")\n' 1. Delete Power Queries\nFor Each pq In wb.Queries\npq.Delete\nNext pq\n' 2. Loop sheets in reverse\nFor i = wb.Worksheets.Count To 1 Step -1\nSet ws = wb.Worksheets(i)\nIf ws.Name = \"Admin\" Then\nws.Delete\nElse\nWith ws.UsedRange\n.Copy\n.PasteSpecial Paste:=xlPasteValuesAndNumberFormats\nEnd With\nApplication.CutCopyMode = False\nEnd If\nNext i\n' 3. Save As\nwb.SaveAs _\nfileName:=savePath & fileName & \"_\" & fileCode & \".xlsx\", _\nFileFormat:=xlOpenXMLWorkbook\n' 4. Open Explorer\nShell \"explorer.exe /select,\"\"\" & savePath & fileName & \"_\" & fileCode & \".xlsx\"\"\",\nvbNormalFocus\nCleanUp:\nApplication.DisplayAlerts = True\nApplication.ScreenUpdating = True\nApplication.EnableEvents = True\nEnd Sub"}, {"id": "1775803819783", "name": "Table of Contents", "type": "VBA", "desc": "Lists all sheet names in the active sheet starting from cell A2, going downward. Simple utility macro with no formatting or hyperlinks.", "code": "Sub ListSheetNames()\n' List all sheet names in column A starting from A2\nDim sh As Worksheet\nDim r As Long\nApplication.ScreenUpdating = False\nr = 2\nFor Each sh In Worksheets\nActiveSheet.Cells(r, 1).Value = sh.Name\nr = r + 1\nNext sh\nApplication.ScreenUpdating = True\nEnd Sub"}, {"id": "1775803801776", "name": "Show File Location", "type": "VBA", "desc": "ShowFileLocation: Displays the local file path of the active workbook and offers to open it in Windows Explorer. Handles SharePoint-hosted files by converting the URL to a local OneDrive path. ConvertSharePointPathToLocal: Converts a SharePoint URL (https://cjmart-my.sharepoint.com/...) to its local OneDrive equivalent (D:\\OneDrive\\OneDrive - cjmart). Passes through paths that are already local.", "code": "Function ConvertSharePointPathToLocal(ByVal fullPath As String) As String\nConst SP_PREFIX As String = _\n\"https://cjmart-my.sharepoint.com/personal/piyathida_pi_cjmart_co_th/Documents\"\nConst LOCAL_PREFIX As String = \"D:\\OneDrive\\OneDrive - cjmart\"\nIf LCase(fullPath) Like \"https://*\" Then\nIf InStr(1, fullPath, SP_PREFIX, vbTextCompare) > 0 Then\nConvertSharePointPathToLocal = Replace( _\nReplace(fullPath, SP_PREFIX, LOCAL_PREFIX, , , vbTextCompare), \"/\", \"\\\")\nElse\nConvertSharePointPathToLocal = \"\"\nEnd If\nElse\nConvertSharePointPathToLocal = fullPath ' already local\nEnd If\nEnd Function\nSub ShowFileLocation()\nDim wb As Workbook\nDim filePath As String, localPath As String\nDim response As VbMsgBoxResult\nSet wb = ActiveWorkbook\nIf wb.Path = \"\" Then\nMsgBox \"This workbook has not been saved yet.\", vbExclamation\nExit Sub\nEnd If\nfilePath = wb.FullName\nlocalPath = ConvertSharePointPathToLocal(filePath)\nIf localPath = \"\" Then\nMsgBox \"Cannot resolve local file path.\", vbCritical\nExit Sub\nEnd If\nresponse = MsgBox(\"File location:\" & vbCrLf & localPath & vbCrLf & vbCrLf & _\n\"Open file location?\", vbQuestion + vbYesNo, \"File Location\")\nIf response = vbYes Then\nShell \"explorer.exe /select,\"\"\" & localPath & \"\"\"\", vbNormalFocus\nEnd If\nEnd Sub"}, {"id": "1775803782284", "name": "Select Dynamic File or Folder", "type": "Power Query", "desc": "get file or folder path from excel value, dynamic, not hard code", "code": "FilePath = Excel.CurrentWorkbook(){[Name=\"currentfolder\"]}[Content]{0}[Column1],\nSource = Folder.Files(FilePath),\n\nFilePath = Excel.CurrentWorkbook(){[Name=\"currentfolder\"]}[Content]{0}[Column1],\nSource = Excel.Workbook(File.Contents(FilePath), null, true),\n\nFilePath = Excel.CurrentWorkbook(){[Name=\"cathead\"]}[Content]{0}[Column1],\nSource = Csv.Document(File.Contents(FilePath),[Delimiter=\",\", Columns=27, Encoding=65001, QuoteStyle=QuoteStyle.None]),"}, {"id": "1775803757527", "name": "Dynamic Select Columns", "type": "Power Query", "desc": "select columns dynamically, select last column, select column with initial", "code": "fixed_col1 = {\"CJX Division\",\"Product\",\"Product Name\"}\n\nfixed_col2 = {\"DC1_ScmAssort\",\"DC1_DCStockQty\",\"DC1_DOHDC\",\"DC2_ScmAssort\",\"DC2_DCStockQty\",\"DC2_DOHDC\"}\n\nfixed_col3 = {\"cjx_assort\"}\n\n\nPOGCols = List.Select(\n        Table.ColumnNames(Source),\n        each Text.StartsWith(_, \"POG Store\")\n    ),\nLastPOG = List.Last(POGCols),\n\nros_qty_col = List.Select(\n        Table.ColumnNames(Source),\n        each Text.StartsWith(_, \"ROS QTY\")\n    ),\n\nros_amt_col = List.Select(\n        Table.ColumnNames(Source),\n        each Text.StartsWith(_, \"ROS AMT\")\n    ),\n\nttl_qty_col = List.Select(\n        Table.ColumnNames(Source),\n        each Text.StartsWith(_, \"TTL_QTY\")\n    ),\n\nttl_amt_col = List.Select(\n        Table.ColumnNames(Source),\n        each Text.StartsWith(_, \"TTL_AMT\")\n    ),"}];
var E=["🐣","🍯","✨","🌟","🐝","🦊","🐥","🌸","🍀","🐧","🦄","🌻","🐱","🦋","🍒","🌈","🐶","🐼","🍓","🌼","🦉","🐰","🐢","🌺","⭐","🐙","🦁","🍋","🌙","🐳","🐦","🍑","💫","🐠","🌷","🐞","🦔","🧸","🍂","🎀"];
var filter="All",vid=null;
function ef(id){var s=""+id,h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return E[h%E.length];}
function es(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function el(id){return document.getElementById(id);}
function types(){var s={};D.forEach(function(d){if(d.type)s[d.type]=1;});return Object.keys(s);}
function chip(l,v){return '<span class="chip'+(filter===v?' on':'')+'" onclick="setFilter(\''+v+'\')">'+es(l)+'</span>';}
function renderChips(){var h=chip('ทั้งหมด','All');types().forEach(function(t){h+=chip(t,t);});el('chips').innerHTML=h;}
function setFilter(v){filter=v;renderChips();rd();}
function find(id){for(var i=0;i<D.length;i++)if(String(D[i].id)===String(id))return D[i];return null;}
function rd(){var q=(el('q').value||"").toLowerCase().trim(),o="",n=0;for(var i=0;i<D.length;i++){var c=D[i];if(filter!=='All'&&c.type!==filter)continue;if(q&&(c.name||"").toLowerCase().indexOf(q)<0&&(c.desc||"").toLowerCase().indexOf(q)<0)continue;n++;o+='<div class="card" onclick="ov(\''+c.id+'\')"><span class="em">'+ef(c.id)+'</span><div class="bd"><div><span class="bg">'+es(c.type)+'</span><div class="tt">'+es(c.name)+'</div></div><div class="ds">'+(c.desc?es(c.desc):"")+'</div></div></div>';}el('c').innerHTML=n?o:'<div class="empty">ไม่พบ</div>';el('cnt').textContent=n+' snippets';}
function ov(id){var f=find(id);if(!f)return;vid=id;el('me').textContent=ef(f.id);el('mbd').textContent=f.type;el('mtt').textContent=f.name;el('mds').textContent=f.desc||"";el('mc').textContent=f.code;el('cb').textContent="คัดลอก";el('mb').classList.add('o');loadOutput(f);}
function close_(){el('mb').classList.remove('o');}
function cp(){var f=find(vid);if(!f)return;var b=el('cb');navigator.clipboard.writeText(f.code).then(function(){b.textContent="คัดลอกแล้ว ✓";},function(){b.textContent="คัดลอกไม่ได้";});}
/* ---- output example ---- */
function loadOutput(f){var wrap=el('outwrap'),box=el('outbox');wrap.style.display='none';box.innerHTML='';var explicit=f.out;if(explicit){var ext=explicit.split('.').pop().toLowerCase();if(ext==='csv'){fetchCsv(explicit,wrap,box);return;}if(/^(png|jpg|jpeg|gif|webp|svg)$/.test(ext)){box.innerHTML='<img src="'+es(explicit)+'" style="max-width:100%;border:1px solid #473c1c;border-radius:8px">';wrap.style.display='block';return;}box.innerHTML='<a class="link" href="'+es(explicit)+'" target="_blank">เปิดไฟล์ตัวอย่าง ('+es(ext)+')</a>';wrap.style.display='block';return;}
fetchCsv('outputs/'+encodeURIComponent(f.id)+'.csv',wrap,box,function(){tryImg(f.id,wrap,box);});}
function fetchCsv(url,wrap,box,onfail){fetch(url).then(function(r){if(!r.ok)return Promise.reject();return r.text();}).then(function(t){if(!t.trim())return Promise.reject();box.innerHTML=csvTable(t);wrap.style.display='block';}).catch(function(){if(onfail)onfail();else wrap.style.display='none';});}
function tryImg(id,wrap,box){var img=new Image();img.onload=function(){box.innerHTML='';img.style.maxWidth='100%';img.style.border='1px solid #473c1c';img.style.borderRadius='8px';box.appendChild(img);wrap.style.display='block';};img.onerror=function(){wrap.style.display='none';};img.src='outputs/'+encodeURIComponent(id)+'.png';}
function parseCSV(text){text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');var rows=[],row=[],cur='',inq=false;for(var i=0;i<text.length;i++){var ch=text[i];if(inq){if(ch=='"'){if(text[i+1]=='"'){cur+='"';i++;}else inq=false;}else cur+=ch;}else{if(ch=='"')inq=true;else if(ch==','){row.push(cur);cur='';}else if(ch=='\n'){row.push(cur);rows.push(row);row=[];cur='';}else cur+=ch;}}if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows.filter(function(r){return r.length>1||(r.length==1&&r[0].trim()!=='');});}
function csvTable(text){var rows=parseCSV(text);if(!rows.length)return '<div class="muted">(ว่าง)</div>';var max=50,head=rows[0],body=rows.slice(1,max+1);var h='<div class="tbl"><table><thead><tr>';head.forEach(function(c){h+='<th>'+es(c)+'</th>';});h+='</tr></thead><tbody>';body.forEach(function(r){h+='<tr>';head.forEach(function(_,ci){h+='<td>'+es(r[ci]==null?'':r[ci])+'</td>';});h+='</tr>';});h+='</tbody></table></div>';if(rows.length-1>max)h+='<div class="muted">แสดง '+max+' จาก '+(rows.length-1)+' แถว</div>';return h;}
document.addEventListener('keydown',function(e){if(e.key==='Escape')close_();});
el('mb').addEventListener('click',function(e){if(e.target===el('mb'))close_();});
renderChips();rd();
