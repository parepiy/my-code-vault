<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #0d0d0d; color: #f3ede0; padding: 0 1.5rem 2rem; }
    .wrap { max-width: 1100px; margin: 0 auto; }
    .top { position: sticky; top: 0; background: #0d0d0d; padding: .9rem 0;
           border-bottom: 1px solid #473c1c; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 8; }
    h1 { font-size: 17px; font-weight: 600; white-space: nowrap;
         background: linear-gradient(90deg, #e8c66a, #d4af37, #9a7d28);
         -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    input, textarea, select {
      padding: 8px 12px; border: 1px solid #473c1c; border-radius: 8px;
      background: #141414; color: #f3ede0; font-size: 14px; outline: none; font-family: inherit; }
    input:focus, textarea:focus, select:focus { border-color: #d4af37; }
    #q { flex: 1; min-width: 160px; }
    .btn { padding: 8px 14px; border: 1px solid #473c1c; border-radius: 8px;
           background: #141414; color: #f3ede0; font-size: 14px; cursor: pointer; white-space: nowrap; }
    .btn:hover { border-color: #d4af37; }
    .btn.gold { background: linear-gradient(135deg, #d4af37, #b8941f); color: #1a1500; font-weight: 600; border-color: #d4af37; }
    .btn.danger:hover { border-color: #d46a6a; color: #f0a9a9; }

    .chips { display: flex; gap: 8px; margin-top: .9rem; flex-wrap: wrap; }
    .chip { font-size: 12.5px; color: #cfc7b5; border: 1px solid #2c2820; border-radius: 999px;
            padding: 5px 13px; cursor: pointer; background: #141414; }
    .chip.on { color: #e8c66a; border-color: #d4af37; background: rgba(212,175,55,.14); }
    .cnt { color: #6b6655; font-size: 12px; margin-top: .8rem; }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
             gap: 12px; margin-top: .6rem; align-items: start; }
    .card { border: 1px solid #473c1c; border-radius: 12px;
            background: linear-gradient(150deg, #1a1812, #141414); cursor: pointer;
            height: 104px; display: flex; gap: 11px; padding: 14px 16px; transition: .18s; }
    .card:hover { border-color: #d4af37; transform: translateY(-2px); }
    .em { font-size: 26px; flex-shrink: 0; }
    .bd { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; height: 100%; }
    .bg { font-size: 10.5px; font-weight: 600; color: #e8c66a; background: rgba(212,175,55,.14);
          border: 1px solid #473c1c; border-radius: 8px; padding: 2px 9px; display: inline-block; margin-bottom: 6px; }
    .tt { font-size: 13px; font-weight: 600; line-height: 1.3; overflow: hidden;
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .ds { font-size: 11px; color: #7a7568; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .empty { text-align: center; padding: 3rem; color: #6b6655; }

    .mbg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 9;
           align-items: center; justify-content: center; }
    .mbg.o { display: flex; }
    .md { background: linear-gradient(160deg, #1a1812, #121212); border: 1px solid #9a7d28;
          border-radius: 14px; padding: 1.5rem; width: min(620px, 94vw); max-height: 88vh; overflow: auto; }
    .mh { display: flex; gap: 10px; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    .mt { font-size: 15px; font-weight: 600; color: #e8c66a; flex: 1; min-width: 120px; }
    pre { background: #0a0a0a; border: 1px solid #473c1c; border-radius: 8px; padding: 12px;
          font-size: 12px; color: #e6dcc4; font-family: monospace; white-space: pre-wrap;
          word-break: break-word; max-height: 340px; overflow: auto; }
    .row { display: flex; gap: 8px; margin-top: 1rem; flex-wrap: wrap; }
    .field { margin-bottom: .8rem; }
    .field label { display: block; font-size: 12px; color: #9a9382; margin-bottom: 4px; }
    .field input, .field textarea, .field select { width: 100%; }
    .field textarea { min-height: 200px; font-family: monospace; font-size: 12px; white-space: pre; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>&#10022; Code Vault</h1>
      <input id="q" placeholder="&#128269; ค้นหา..." oninput="rd()">
      <button class="btn gold" onclick="openForm()">+ เพิ่มโค้ด</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="cnt" id="cnt"></div>
    <div class="cards" id="c"><div class="empty">กำลังโหลด…</div></div>
  </div>

  <!-- view modal -->
  <div class="mbg" id="mb">
    <div class="md">
      <div class="mh">
        <span id="me" style="font-size:28px"></span>
        <span class="bg" id="mbd"></span>
        <span class="mt" id="mtt"></span>
      </div>
      <div class="ds" id="mds" style="margin-bottom:1rem;color:#9a9382;white-space:normal"></div>
      <pre id="mc"></pre>
      <div class="row">
        <button class="btn gold" id="cb" onclick="cp()">คัดลอก</button>
        <button class="btn" onclick="editCurrent()">แก้ไข</button>
        <button class="btn danger" onclick="delCurrent()">ลบ</button>
        <button class="btn" onclick="close_('mb')">ปิด</button>
      </div>
    </div>
  </div>

  <!-- add/edit modal -->
  <div class="mbg" id="fb">
    <div class="md">
      <div class="mh"><span class="mt" id="ftitle">เพิ่มโค้ด</span></div>
      <div class="field"><label>ชื่อ (name)</label><input id="fname"></div>
      <div class="field"><label>ประเภท (type)</label>
        <select id="ftype"><option>BigQuery</option><option>VBA</option><option>Power Query</option></select></div>
      <div class="field"><label>คำอธิบาย (desc)</label><input id="fdesc"></div>
      <div class="field"><label>โค้ด (code)</label><textarea id="fcode"></textarea></div>
      <div class="row">
        <button class="btn gold" id="saveBtn" onclick="save()">บันทึก</button>
        <button class="btn" onclick="close_('fb')">ยกเลิก</button>
      </div>
    </div>
  </div>

  <script>
    var D = [];
    var filter = 'All';
    var vid = null;     // currently viewed id
    var editId = null;  // id being edited (null = adding)

    var E = ["🐣","🍯","✨","🌟","🐝","🦊","🐥","🌸","🍀","🐧","🦄","🌻","🐱","🦋","🍒","🌈","🐶","🐼","🍓","🌼","🦉","🐰","🐢","🌺","⭐","🐙","🦁","🍋","🌙","🐳","🐦","🍑","💫","🐠","🌷","🐞","🦔","🧸","🍂","🎀"];
    function ef(id){ var s=""+id,h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return E[h%E.length]; }
    function es(x){ return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
    function el(id){ return document.getElementById(id); }

    function types(){ var s={}; D.forEach(function(d){ if(d.type) s[d.type]=1; }); return Object.keys(s); }

    function renderChips(){
      var html = chip('ทั้งหมด','All');
      types().forEach(function(t){ html += chip(t,t); });
      el('chips').innerHTML = html;
    }
    function chip(label,val){
      return '<span class="chip'+(filter===val?' on':'')+'" onclick="setFilter(\''+es(val).replace(/\'/g,"")+'\')">'+es(label)+'</span>';
    }
    function setFilter(v){ filter=v; renderChips(); rd(); }

    function rd(){
      var q=(el('q').value||"").toLowerCase().trim(), o="", n=0;
      for(var i=0;i<D.length;i++){
        var c=D[i];
        if(filter!=='All' && c.type!==filter) continue;
        if(q && (c.name||"").toLowerCase().indexOf(q)<0 && (c.desc||"").toLowerCase().indexOf(q)<0) continue;
        n++;
        o+='<div class="card" onclick="ov(\''+c.id+'\')"><span class="em">'+ef(c.id)+'</span>'+
           '<div class="bd"><div><span class="bg">'+es(c.type)+'</span>'+
           '<div class="tt">'+es(c.name)+'</div></div>'+
           '<div class="ds">'+(c.desc?es(c.desc):"")+'</div></div></div>';
      }
      el('c').innerHTML = n ? o : '<div class="empty">ไม่พบ</div>';
      el('cnt').textContent = n + ' snippets';
    }

    function find(id){ for(var i=0;i<D.length;i++) if(String(D[i].id)===String(id)) return D[i]; return null; }

    function ov(id){
      var f=find(id); if(!f) return; vid=id;
      el('me').textContent=ef(f.id); el('mbd').textContent=f.type;
      el('mtt').textContent=f.name; el('mds').textContent=f.desc||"";
      el('mc').textContent=f.code; el('cb').textContent="คัดลอก";
      el('mb').classList.add('o');
    }
    function close_(id){ el(id).classList.remove('o'); }

    function cp(){
      var f=find(vid); if(!f) return;
      var b=el('cb');
      navigator.clipboard.writeText(f.code).then(function(){ b.textContent="คัดลอกแล้ว ✓"; },
        function(){ b.textContent="คัดลอกไม่ได้"; });
    }

    function openForm(){
      editId=null; el('ftitle').textContent="เพิ่มโค้ด";
      el('fname').value=""; el('ftype').value="BigQuery"; el('fdesc').value=""; el('fcode').value="";
      el('fb').classList.add('o'); el('fname').focus();
    }
    function editCurrent(){
      var f=find(vid); if(!f) return;
      editId=f.id; el('ftitle').textContent="แก้ไขโค้ด";
      el('fname').value=f.name||""; el('ftype').value=f.type||"BigQuery";
      el('fdesc').value=f.desc||""; el('fcode').value=f.code||"";
      close_('mb'); el('fb').classList.add('o');
    }
    function delCurrent(){
      var f=find(vid); if(!f) return;
      if(!confirm('ลบ "'+f.name+'" ?')) return;
      busy(true);
      google.script.run.withSuccessHandler(function(j){ D=JSON.parse(j); afterChange(); close_('mb'); })
        .withFailureHandler(fail).deleteSnippet(f.id);
    }
    function save(){
      var obj={ id:editId, name:el('fname').value, type:el('ftype').value,
                desc:el('fdesc').value, code:el('fcode').value };
      if(!obj.name.trim()){ alert('ใส่ชื่อก่อน'); return; }
      busy(true);
      var cb=function(j){ D=JSON.parse(j); afterChange(); close_('fb'); };
      if(editId) google.script.run.withSuccessHandler(cb).withFailureHandler(fail).updateSnippet(obj);
      else       google.script.run.withSuccessHandler(cb).withFailureHandler(fail).addSnippet(obj);
    }
    function afterChange(){ busy(false); renderChips(); rd(); }
    function busy(on){ el('saveBtn').textContent = on ? 'กำลังบันทึก…' : 'บันทึก'; el('saveBtn').disabled=on; }
    function fail(e){ busy(false); alert('ผิดพลาด: ' + (e && e.message ? e.message : e)); }

    document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ close_('mb'); close_('fb'); } });
    [ 'mb','fb' ].forEach(function(id){ el(id).addEventListener('click', function(e){ if(e.target===el(id)) close_(id); }); });

    function boot(){
      google.script.run.withSuccessHandler(function(j){
        D=JSON.parse(j); renderChips(); rd();
      }).withFailureHandler(function(e){
        el('c').innerHTML='<div class="empty">โหลดไม่ได้: '+es(e && e.message)+'</div>';
      }).getSnippets();
    }
    boot();
  </script>
</body>
</html>
